<style>
:root{--bg:#fff;--pn:#f3f4f8;--tx:#1c2030;--mu:#6b7194;--ac:#c44f6b;--ln:#d9dce8;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{background:var(--bg);color:var(--tx);font:14px/1.5 "Yu Gothic","Hiragino Sans",sans-serif;display:flex;flex-direction:column;overflow:hidden}

.tabs{display:flex;gap:4px;flex-wrap:wrap}

.phx{font-size:11px;letter-spacing:.08em}
.el.lk{outline:1px dashed #9aa0be}.el.sel.lk{outline:2px solid #c44f6b}

.lg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:auto;padding:8px;flex:1;align-content:start}

.at.on{border-color:#c44f6b;box-shadow:0 0 0 2px rgba(196,79,107,.3)}.at .nm{font-size:11px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}

#bd.dk .vph{background:#2b3047;color:#9aa0be}.vcap{position:absolute;left:0;right:0;bottom:0;height:28px;line-height:28px;text-align:center;font-size:14px;color:#3d4466;white-space:nowrap;overflow:hidden}#bd.dk .vcap{color:#c5cadb}
.pop input[type=number]{width:64px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:3px 6px}
.el.pt{pointer-events:none}.el.pt.sel{pointer-events:auto}.ptc,.pto{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

#pp .pr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#pp input[type=range]{width:150px}
.el.np::before{content:"PDF外";position:absolute;left:2px;top:2px;font-size:10px;background:#7c83a6;color:#fff;border-radius:6px;padding:0 5px;z-index:3;pointer-events:none}
#side .it.npi span{text-decoration:line-through;opacity:.6}.x.np{font-size:10px}
.fsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;padding:10px;overflow:auto;flex:1;align-content:start}
.fsi{border:1px solid var(--ln);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--pn);position:relative;text-align:center}.fsi img{width:100%;height:84px;object-fit:cover;display:block}
.fsi .ic{font-size:40px;line-height:84px}.fsi .nm{font-size:11px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsi.on{border-color:#c44f6b;box-shadow:0 0 0 2px rgba(196,79,107,.35)}.fsi.on::after{content:"✓";position:absolute;right:4px;top:4px;background:#c44f6b;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;font-size:12px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}.gc{border:1px solid var(--ln);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.gc .th{background:var(--pn);border-radius:8px;min-height:96px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
</style>

<body>
<header>
  <h1><span id="pn" title="クリックでプロジェクト名を編集"></span><small style="font:12px 'Yu Gothic',sans-serif;letter-spacing:.2em;color:var(--mu);margin-left:10px">SETTING BOOK</small></h1>
  <div class="tabs" id="st1"></div>
  <button id="mode"></button>
  <button id="ft" title="各ページ左下のフッター表示">フッター</button>
  <button id="pres" title="全画面で閲覧（←→でページ移動、Escで終了）">プレゼン</button>
  <button id="exp" title="index.html + project.js + images/（相対パス）のzip">サイト書き出し(zip)</button>
  <button id="lib">画像ライブラリ</button>
  <button id="pdf">PDF（この項目）</button>
  <button id="png" title="各ページをPNGにしてzipで保存（見開きは左右に分割）">PNG(zip)</button>
  <button id="pdfa">PDF（全項目）</button>
  <button id="imp">読み込み(zip/JSON)</button>
  <button id="impf">フォルダ読み込み</button>
  <button id="th">明/暗</button>
  <span id="st"></span>
</header>
<div id="bn"></div>
<div id="main">
  <div id="side"></div>
  <div id="mid">
    <div id="pt"></div>
    <div id="tb"></div>
    <div id="hint">画像はドラッグ＆ドロップ／貼り付け（Ctrl+V）。ダブルクリック：文字は編集、画像はトリミング位置モード（ドラッグで移動・ホイールで拡大縮小）。上の丸ハンドルで回転（Shiftで15°刻み）、角で拡大縮小（Shiftで比率固定）。Shift+クリックで複数選択、Ctrl+C/X/Vでコピー・切り取り・貼り付け（要素もページも）、Ctrl+Aで全選択。</div>
    <div id="view"></div>
  </div>
  <div id="libp"></div>
</div>
<button id="pxit">× プレゼン終了</button>
<input type="file" id="fi" accept="image/*" multiple hidden>
<input type="file" id="ji" accept=".zip,.json,.js" multiple hidden>
<input type="file" id="jf" webkitdirectory multiple hidden>
<script>
const $=(s,p=document)=>p.querySelector(s), uid=()=>Math.random().toString(36).slice(2,9);
const SEC={book:"表紙・扉",chars:"キャラクター",bgs:"背景",stills:"スチル",arts:"イラスト・ポスター"};
const sz={s:[1280,720],d:[2560,720],v:[720,1020],vd:[1440,1020]};
const F=(x,y,w,h,cap="",nc=false)=>({id:uid(),t:"img",x,y,w,h,img:null,cap,fit:"cover",nc,rot:0,ix:0,iy:0,iz:1});
const T=(x,y,w,h,txt,fs=16,b=false)=>({id:uid(),t:"txt",x,y,w,h,txt,fs,b,rot:0});
const P=(n,k,els,o)=>Object.assign({id:uid(),name:n,w:sz[k][0],h:sz[k][1],els,bg:"w",sp:k==="d"||k==="vd"},o||{});
const ttl=x=>T(40,24,1100,56,x,34,true), lab=(x,y,t)=>T(x,y,500,26,t,13,true);
function mk(s,n){
  const th=[0,1,2,3].map(i=>F(40+i*195,556,180,130,["昼","夕","夜","雨"][i]));
  const L={
  gen:()=>[P("メイン","s",[ttl(n),F(40,100,560,580,"MAIN"),lab(640,100,"OVERVIEW 概要"),T(640,134,600,200,"概要を記入"),lab(640,360,"VARIATIONS 差分"),VG(640,394,600,290,2,3,["差分 1","差分 2","差分 3","差分 4","差分 5","差分 6"])]),P("詳細（見開き）","d",[ttl(n+" 詳細"),F(40,100,580,580,"IMAGE"),F(660,100,580,280,"IMAGE"),F(660,400,580,280,"IMAGE"),lab(1320,100,"NOTES 設定メモ"),T(1320,134,1160,500,"メモを記入")])],
  book:()=>[coverPage(),tocPage(),secPage("01","CHARACTER","キャラクター設定資料",0,"chars"),secPage("02","BACKGROUND","背景設定資料",0,"bgs"),secPage("03","STILL","スチル設定資料",0,"stills")],
  chars:()=>[
    P("プロフィール","s",[ttl(n),F(40,100,330,580),lab(400,100,"PROFILE 基本情報"),T(400,134,320,220,"役割：\n年齢：\n身長：\n誕生日：\n所属："),lab(760,100,"OVERVIEW 概要"),T(760,134,470,220,"概要を記入"),lab(400,372,"EXPRESSIONS 差分（差分枠の設定で行・列を変更）"),VG(400,404,830,260,1,4,["通常","笑顔","怒り","悲しみ"])]),
    P("詳細資料（見開き）","d",[ttl(n+" 詳細"),F(40,100,360,580,"FRONT"),F(420,100,360,580,"SIDE"),F(800,100,360,580,"BACK"),lab(1320,100,"COLOR PALETTE カラー指定"),PAL(1320,134,1120,170,[["#c44f6b","髪"],["#1c2030","瞳"],["#e9b8c4","肌"],["#7c83a6","服 1"],["#b9bdd3","服 2"],["#d8b26e","差し色"]]),lab(1320,340,"NOTES 設定メモ"),T(1320,374,1160,300,"デザインのポイントを記入")]),
    P("ラフ・別絵（見開き）","d",[ttl(n+" ラフ・別絵"),F(40,100,580,580,"ラフ"),F(660,100,580,280,"別絵 1"),F(660,400,580,280,"別絵 2"),F(1320,100,580,280,"別絵 3"),F(1320,400,580,280,"別絵 4"),F(1940,100,540,580,"別絵 5")])],
  bgs:()=>[
    P("背景メイン","s",[ttl(n),F(40,100,760,430,"MAIN"),...th,lab(840,100,"OVERVIEW 概要"),T(840,134,400,150,"概要を記入"),lab(840,300,"INFO 基本情報"),T(840,334,400,200,"場所：\n時間帯：\n天候：\n使用シーン：")]),
    P("見取り図・オブジェクト","d",[ttl(n+" 詳細"),F(40,100,580,400,"LAYOUT MAP"),lab(40,520,"NOTES 設定メモ"),T(40,554,580,130,"メモを記入"),F(1320,100,360,300,"OBJECT 1"),F(1700,100,360,300,"OBJECT 2"),F(2080,100,360,300,"OBJECT 3"),lab(1320,430,"COLOR 配色"),PAL(1320,462,1120,150,[["#1c2030","基調"],["#4a5278","影"],["#e9b8c4","光"],["#b9bdd3","空"],["#d8b26e","差し色"]]),T(1320,626,1120,60,"配色・光源メモ")])],
  stills:()=>[
    P("スチル","s",[ttl(n),lab(40,100,"SCENE シーン概要"),T(40,134,400,200,"シーン概要を記入"),lab(40,350,"INFO 基本情報"),T(40,384,400,260,"登場キャラ：\n場所：\n使用シーン：\n解放条件："),F(480,100,760,430,"STILL"),...th.map((e,i)=>Object.assign(e,{x:480+i*195,cap:["BASE","差分 1","差分 2","差分 3"][i]}))]),
    P("構図ラフ・差分管理","d",[ttl(n+" 詳細"),F(40,100,580,330,"ROUGH"),F(40,450,285,230,"線画"),F(335,450,285,230,"着彩"),lab(1320,100,"VARIATIONS 差分管理"),T(1320,134,1160,500,"ID　差分名　内容　状態\nCG_001_A　ベース　通常　作業中")])],
  arts:()=>[
    P("イラスト集","s",[ttl(n),F(40,100,380,580),F(440,100,380,580),F(840,100,400,280),F(840,400,400,280)]),
    P("ポスター","v",[F(30,30,660,960,"",true)])]
  };
  return {id:uid(),name:n,pages:(L[s]||L.gen)()};
}
let cropId=null,S=null,edit=true,sel=null,undo=[],redo=[],multi=new Set(),snap=true,zm=1,pick=null,dr=null;
const fresh=()=>({sec:{book:[mk("book","ブック構成"),vItem("book","ブック構成（縦）")],chars:[mk("chars","キャラクター 01"),vItem("chars","キャラクター 02（縦）")],bgs:[mk("bgs","背景 01"),vItem("bgs","背景 02（縦）")],stills:[mk("stills","スチル 01"),vItem("stills","スチル 02（縦）")],arts:[mk("arts","イラスト・ポスター 01"),vItem("arts","イラスト 02（縦）")]},imgs:{},ar:{},tpl:nt(),proj:{name:"プロジェクト名",ft:true},cats:defCats(),cur:{s:"chars",i:null,p:0}});
const item=()=>S.sec[S.cur.s].find(x=>x.id===S.cur.i), pg=()=>{const it=item();return it&&it.pages[S.cur.p]||null}, fe=id=>pg().els.find(e=>e.id===id);
const pu=()=>{undo.push(JSON.stringify(S.sec));redo.length=0;if(undo.length>50)undo.shift()};
// ---- storage ----
let tm;
function save(){if(MODE==="server"){$("#st").textContent="保存中…";clearTimeout(tm);tm=setTimeout(flush,500)}else{$("#st").textContent="未保存（サーバー未接続）"}}
// ---- images ----
async function rd(f){const u=URL.createObjectURL(f),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});const k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,im.width*k|0);c.height=Math.max(1,im.height*k|0);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return{u:c.toDataURL("image/webp",.9),r:im.height/im.width}}
// ---- drawing ----
function draw(){side();tabs();bar();board();}
function tabs(){
  const t=$("#st1");t.innerHTML="";
  Object.entries(SEC).forEach(([k,v])=>{const b=document.createElement("button");b.textContent=v;b.className=S.cur.s===k?"on":"";b.onclick=()=>{S.cur.s=k;S.cur.i=S.sec[k][0]?.id||null;S.cur.p=0;sel=null;draw()};t.append(b)});
  if(edit){const ab=document.createElement("button");ab.textContent="＋ セクション";ab.onclick=()=>secModal();t.append(ab)}
  $("#mode").textContent=edit?"編集中 → 閲覧":"閲覧中 → 編集";$("#pn").textContent=S.proj.name;$("#ft").className=S.proj.ft?"on":"";

const orientOf=p=>(isSp(p)?p.w/2:p.w)>p.h?"h":"v";
function cardsFor(s){
  const out=[],nm="名前",stdH=mk(s,nm).pages,stdV=mkv(s,nm);
  out.push({id:"b:seth",name:"標準セット（横）",b:1,make:n=>mk(s,n).pages,sample:stdH},{id:"b:setv",name:"標準セット（縦）",b:1,make:n=>mkv(s,n),sample:stdV});
  stdH.forEach((p,i)=>out.push({id:"b:h"+i,name:p.name,b:1,make:n=>[mk(s,n).pages[i]],sample:[p]}));
  stdV.forEach((p,i)=>out.push({id:"b:v"+i,name:p.name,b:1,make:n=>[mkv(s,n)[i]],sample:[p]}));
  [false,true].forEach(v=>commonPages(v).forEach(([n2,f],i)=>out.push({id:"b:c"+(v?"v":"h")+i,name:n2+(v?"（縦）":"（横）"),b:1,common:1,make:()=>[f()],sample:[f()]})));
  (S.tpl[s]||[]).forEach(t=>out.push({id:t.id,name:t.name,ref:t,list:S.tpl[s],scope:"s",pages:t.pages,sample:t.pages}));
  (S.tpl._all||[]).forEach(t=>out.push({id:t.id,name:t.name,ref:t,list:S.tpl._all,scope:"all",pages:t.pages,sample:t.pages}));
  return out;
}
