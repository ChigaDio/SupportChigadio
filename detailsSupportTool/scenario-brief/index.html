<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>シナリオ演出依頼資料集</title>
<style>
:root{--b:#2f5d8a;--bg:#e9ebee;--tx:#222;--pn:#fff;--bd:#cfd5dc}
@media(prefers-color-scheme:dark){:root{--bg:#1d2126;--tx:#e6e8ea;--pn:#2a2f36;--bd:#454c55}}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
header,.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}
button,select,input,textarea{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
input[type=color]{padding:0;width:34px;height:28px}input[type=range]{padding:0;width:90px}
button{cursor:pointer}button.on{background:var(--b);color:#fff;border-color:var(--b)}
.sw{width:22px;height:22px;padding:0;border-radius:50%}
section{display:none}section.on{display:block}
#area{padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow:auto}
.pg{position:relative;width:793px;height:1122px;background:#fff;color:#222;padding:60px 56px;overflow:hidden;box-shadow:0 2px 10px #0003;flex:none}
.pb{height:100%;overflow:hidden;font:16px/1.9 "Hiragino Mincho ProN","Yu Mincho",serif}
.pb p{margin:0;min-height:1.9em}
canvas{position:absolute;left:0;top:0;width:793px;height:1122px;touch-action:none;mix-blend-mode:multiply;cursor:crosshair}
.sel canvas{pointer-events:none}
.dl{background:#fff3b8;border-radius:3px}.sel .dl{cursor:pointer}.sel .dl:hover{outline:2px solid var(--b)}
.sp{font:700 11px sans-serif;color:#fff;border-radius:3px;padding:1px 5px;margin-right:2px;vertical-align:2px}
.pn{position:absolute;right:20px;bottom:14px;font:11px sans-serif;color:#999}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:8px;margin:8px 0;display:grid;gap:6px}
.card .bar{padding:0;border:0}.card input[data-f=name]{flex:1}
.wrap{max-width:900px;margin:0 auto;padding:12px}
#tx{width:100%;height:60vh;font:15px/1.7 serif;margin-top:8px}
.hint{font-size:12px;opacity:.7}
#dp{display:none}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.np{display:none!important}#area{padding:0;gap:0;display:block}.pg{box-shadow:none;break-after:page}#area .pg:last-child{break-after:auto}#cp.on,#dp.on{display:block}.dpg{break-before:page;padding:18mm;color:#222;background:#fff;font:12px/1.7 sans-serif}}
#cp{display:none}#cvr{padding:16px;display:flex;justify-content:center}h2{margin:8px 0}
.cover{padding:0;display:flex;background:#f6f7f9;color:#1b2333}
.cvb{width:236px;background:#1f3a6e;display:flex;justify-content:center;padding-top:96px}
.cvt{writing-mode:vertical-rl;color:#fff;font:600 54px/1.35 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.16em;max-height:920px;overflow:hidden}
.cvm{flex:1;padding:100px 56px 56px 64px;display:flex;flex-direction:column;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.cvs{font-size:20px;letter-spacing:.3em;line-height:2.1;border-top:3px solid #1f3a6e;padding-top:18px;width:max-content}
.cvl{margin:60px 0 0;padding:0;list-style:none;counter-reset:n;font-size:15px;line-height:2.3;flex:1;overflow:hidden}
.cvl li{counter-increment:n;border-bottom:1px solid #d3d8e0}.cvl li::before{content:"第" counter(n,cjk-decimal) "章　";color:#1f3a6e;font-weight:600}
.cvf{font:12px/1.8 system-ui,sans-serif;color:#667}
</style></head><body>
<header class="np"><b>演出依頼資料集</b>
<label>名前 <input id="me" size="8" placeholder="自分の名前"></label>
<select id="ch"></select>
<span class="tabs"><button data-t="cv">表紙</button> <button data-t="v">資料</button> <button data-t="t">本文</button> <button data-t="d1">世界観</button> <button data-t="d2">用語</button> <button data-t="d3">キャラクター</button></span>
<span style="flex:1"></span>
<button id="rl" title="git pull のあとなどに、ディスクの内容を読み直します">🔄 再読込</button>
<label><input type="checkbox" id="wd"> 辞書も出力</label><button id="pr">📄 PDF出力(A4)</button><span id="st" class="hint"></span></header>

<div id="cp"></div>
<section id="cv" class="np"><div class="bar"><label>プロジェクト名 <input id="pj" size="26" placeholder="例：星降る町のレクイエム"></label><span class="hint">この名前から表紙が作られ、PDFの1枚目になります</span></div><div id="cvr"></div></section>
<section id="v"><div class="bar np" id="tb"></div><div id="area"></div></section>

<section id="t" class="np"><div class="wrap"><div class="bar"><button id="nc">＋新しい章</button><input id="ti" placeholder="章タイトル" style="flex:1"><button id="cu">↑ 前へ</button><button id="cd">↓ 後ろへ</button><button id="cx">🗑 この章を削除</button></div>
<div class="hint">小説をそのまま貼り付け。「---」だけの行で強制改ページ。本文を直すと書き込みの位置がずれることがあります。</div>
<textarea id="tx" placeholder="ここに小説をコピペ"></textarea></div></section>
<section id="d" class="np"><div class="wrap"><h2 id="dh"></h2><div class="hint" id="dn"></div><div class="bar"><button id="na"></button>
<label><input type="checkbox" id="fh" checked> 今の章＋共通のみ</label><input id="fq" placeholder="検索"></div><div id="dl"></div></div></section>
<div id="dp"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=793,H=1122,id=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const h=s=>{let x=0;for(const c of s)x=Math.imul(31,x)+c.charCodeAt(0)|0;return(x>>>0).toString(36)};
const CATS=['世界観','用語','キャラクター','章設定'],FREE=['pen','marker','brush'];
const TPL=['BGM','SE','背景','暗転','立ち絵','表情','カメラ','演出','ウェイト','自由メモ…'],COL=['#e11d48','#2563eb','#16a34a','#facc15','#111827'];
const TOOLS=[['pen','✏️鉛筆'],['marker','🖍マーカー'],['brush','🖌筆'],['line','／線'],['arrow','→矢印'],['rect','▭四角'],['ellipse','◯丸'],['tpl','🏷テンプレ'],['text','Ｔ文字'],['eraser','🧽消しゴム'],['sel','👆話者指定']];
let S={me:'',project:'',chapters:{},dict:{},layers:{}};
let tool='pen',dirty=new Set(),hist=[],reds=[],tm;
const chs=()=>Object.values(S.chapters).sort((a,b)=>a.order-b.order||(a.id<b.id?-1:1)),cp=()=>S.chapters[S.cur];
const lay=(u,c)=>((S.layers[u]??={})[c]??={erased:[],speakers:{},strokes:[]}),mine=()=>lay(S.me,S.cur);
const myp=()=>`users/${S.me}/${S.cur}.json`,mk=p=>dirty.add(p);
const need=()=>S.me?1:(alert('上の「名前」欄に自分の名前を入力してください。書き込みは名前ごとに保存されます。'),0);
const col=()=>$('#co').value,wd=()=>+$('#wi').value;

/* ---- 保存 (Pythonサーバー経由で1ファイル=1作者/1章/1項目。他人のファイルは書き換えない) ---- */
const api=(m,u,b)=>fetch(u,{method:m,body:b}).then(r=>{if(!r.ok)throw Error(r.status);return r});
const J=o=>JSON.stringify(o,null,1)+'\n';
const jl=l=>`{\n"erased":${JSON.stringify(l.erased)},\n"speakers":${JSON.stringify(Object.fromEntries(Object.entries(l.speakers).sort()))},\n"strokes":[\n${l.strokes.map(s=>JSON.stringify(s)).join(',\n')}\n]\n}\n`;
function cont(p){if(p=='project.json')return J({name:S.project});const[a,b,c]=p.split('/'),k=(b||'').slice(0,-5);
 if(a=='chapters')return S.chapters[k]?J(S.chapters[k]):null;if(a=='dictionary')return S.dict[k]?J(S.dict[k]):null;const l=S.layers[b]?.[c.slice(0,-5)];return l?jl(l):null}
function save(){clearTimeout(tm);tm=setTimeout(flush,400);$('#st').textContent='…'}
async function flush(){try{for(const p of[...dirty]){const t=cont(p);await api(t==null?'DELETE':'PUT','/api/file?path='+encodeURIComponent(p),t);dirty.delete(p)}$('#st').textContent='保存済み'}catch(e){$('#st').textContent='保存失敗: '+e.message}}
async function load(){const c=S.cur;S=await(await api('GET','/api/all')).json();S.cur=c;hist=[];reds=[]}
$('#rl').onclick=async()=>{await flush();await load();init()};

/* ---- タブ・章・表紙 ---- */
let ct,dcat=CATS[0];
function tab(t){ct=t;const s=t[0]=='d'?'d':t;if(s=='d')dcat=CATS[t[1]-1];
 $$('section').forEach(x=>x.classList.toggle('on',x.id==s));$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
 if(s=='cv'){$('#pj').value=S.project||'';$('#cvr').innerHTML=coverHtml()}if(s=='v')render();if(s=='t'){$('#ti').value=cp()?.title||'';$('#tx').value=cp()?.text||''}if(s=='d')renderDict()}
$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function chSel(){if(!(S.cur in S.chapters))S.cur=chs()[0]?.id;$('#ch').innerHTML=chs().map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');$('#ch').value=S.cur||''}
function init(){chSel();$('#me').value=S.me||'';tab(ct||'cv')}
$('#ch').onchange=()=>{S.cur=$('#ch').value;hist=[];reds=[];tab(ct)};
$('#me').onchange=()=>{S.me=$('#me').value.replace(/[\\/:*?"<>|\s]/g,'_');$('#me').value=S.me;api('PUT','/api/me',S.me)};
const coverHtml=()=>{const t=S.project||'無題のプロジェクト',us=Object.keys(S.layers).filter(u=>u);
 return `<div class="pg cover"><div class="cvb"><div class="cvt" style="font-size:${t.length>12?38:54}px">${esc(t)}</div></div><div class="cvm"><div class="cvs">シナリオスクリプト<br>演出依頼資料集</div><ol class="cvl">${chs().map(c=>`<li>${esc(c.title)}</li>`).join('')}</ol><div class="cvf">${new Date().toLocaleDateString('ja-JP')}<br>${us.map(esc).join(' / ')}</div></div></div>`};
$('#pj').oninput=()=>{S.project=$('#pj').value;mk('project.json');save();$('#cvr').innerHTML=coverHtml()};
$('#nc').onclick=()=>{const t=prompt('章タイトル');if(!t)return;const i=id('c');S.chapters[i]={id:i,title:t,order:chs().length?Math.max(...chs().map(c=>c.order))+1:1,text:''};S.cur=i;mk(`chapters/${i}.json`);save();init();tab('t')};
$('#tx').oninput=()=>{if(cp()){cp().text=$('#tx').value;mk(`chapters/${S.cur}.json`);save()}};
$('#ti').oninput=()=>{if(cp()){cp().title=$('#ti').value;mk(`chapters/${S.cur}.json`);save();chSel()}};
/* 並べ替えは前後の章のorderの中間値を入れるだけ → 書き換わるファイルは動かした章の1つだけ */
function mv(dn){const a=chs(),i=a.findIndex(c=>c.id==S.cur),j=dn?i+1:i-1;if(i<0||j<0||j>=a.length)return;const lo=a[dn?j:j-1],hi=a[dn?j+1:j];
 S.chapters[S.cur].order=lo?(hi?(lo.order+hi.order)/2:lo.order+1):hi.order-1;mk(`chapters/${S.cur}.json`);save();chSel()}
$('#cu').onclick=()=>mv(0);$('#cd').onclick=()=>mv(1);
$('#cx').onclick=()=>{const c=cp();if(!c||!confirm(`「${c.title}」を削除しますか？\n自分の書き込みも消えます（他の人の書き込みファイルは残ります）`))return;const i=S.cur;
 delete S.chapters[i];mk(`chapters/${i}.json`);if(S.layers[S.me]?.[i]){delete S.layers[S.me][i];mk(`users/${S.me}/${i}.json`)}S.cur=undefined;hist=[];reds=[];save();init()};

/* ---- 世界観・用語・キャラクター ---- */
const opt=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('');
const TT={世界観:'世界観設定',用語:'用語集',キャラクター:'キャラクター設定'},PH={世界観:'舞台・歴史・ルール・雰囲気など',用語:'意味・読み・使われる場面',キャラクター:'一人称・口調・年齢・外見・性格・関係性など'};
function renderDict(){const q=$('#fq').value;$('#dh').textContent=TT[dcat];$('#dn').textContent=dcat=='キャラクター'?'ここで作ったキャラクターが、資料タブの「👆話者指定」で選べます。':'「全章共通」か、特定の章だけに紐づけられます。';$('#na').textContent='＋'+dcat+'を追加';
 const a=Object.values(S.dict).filter(d=>!d.del&&d.cat==dcat&&(!$('#fh').checked||!d.ch||d.ch==S.cur)&&(!q||(d.name+d.body).includes(q))).sort((x,y)=>x.name.localeCompare(y.name));
 $('#dl').innerHTML=a.map(d=>`<div class="card" data-i="${d.id}"><div class="bar"><input data-f="name" value="${esc(d.name)}" placeholder="名前"><select data-f="ch"><option value="">全章共通</option>${chs().map(c=>`<option value="${c.id}"${c.id==d.ch?' selected':''}>${esc(c.title)}</option>`).join('')}</select><button data-x>🗑</button></div><textarea data-f="body" rows="${dcat=='世界観'?8:4}" placeholder="${PH[dcat]}">${esc(d.body)}</textarea></div>`).join('')||'<p>まだありません。右上の「＋追加」から作成します。</p>'}
$('#fq').oninput=$('#fh').onchange=renderDict;
$('#na').onclick=()=>{const i=id('e');S.dict[i]={id:i,cat:dcat,name:'新規',body:'',ch:''};mk(`dictionary/${i}.json`);save();renderDict()};
$('#dl').oninput=e=>{const c=e.target.closest('.card'),f=e.target.dataset.f;if(c&&f){S.dict[c.dataset.i][f]=e.target.value;mk(`dictionary/${c.dataset.i}.json`);save()}};
$('#dl').onclick=e=>{const c=e.target.closest('.card');if(c&&e.target.dataset.x!=null&&confirm('削除しますか？')){S.dict[c.dataset.i].del=1;mk(`dictionary/${c.dataset.i}.json`);save();renderDict()}};
const ents=()=>Object.values(S.dict).filter(d=>!d.del&&(!d.ch||d.ch==S.cur));

/* ---- 資料ビュー ---- */
const spk=()=>{const m={};for(const l of Object.values(S.layers))for(const[k,v]of Object.entries(l[S.cur]?.speakers||{}))if(!m[k]||v[1]>m[k][1])m[k]=v;return m};
const line=(l,cnt,sp)=>esc(l).replace(/「[^」]*」/g,m=>{const k=h(m)+'.'+(cnt[m]=(cnt[m]||0)+1),d=S.dict[(sp[k]||[])[0]];return(d&&!d.del?`<b class="sp" style="background:hsl(${parseInt(h(d.name),36)%360},55%,38%)">${esc(d.name)}</b>`:'')+`<span class="dl" data-k="${k}">${m}</span>`});
function render(){const a=$('#area'),c=cp(),y=scrollY;a.innerHTML='';a.className=tool=='sel'?'sel':'';
 if(!c){a.innerHTML='<p>「本文」タブで章を作り、小説を貼り付けてください。</p>';return}
 let n=0,pg,cnt={},sp=spk();const np=()=>{pg=document.createElement('div');pg.className='pg';pg.innerHTML='<div class="pb"></div><canvas width="1586" height="2244"></canvas><span class="pn"></span>';a.append(pg);pg.i=n++;pg.b=pg.firstChild;pg.lastChild.textContent=`${c.title}  p.${n}`};np();
 for(const l of c.text.split('\n')){if(l.trim()=='---'){np();continue}
  const p=document.createElement('p');p.innerHTML=line(l,cnt,sp);pg.b.append(p);
  if(pg.b.scrollHeight>pg.b.clientHeight+1&&pg.b.children.length>1){pg.b.removeChild(p);np();pg.b.append(p)}}
 $$('#area .pg').forEach(bind);paintAll();scrollTo(0,y)}
$('#area').onclick=e=>{const s=e.target.closest('.dl');if(tool!='sel'||!s||!need())return;
 const cs=ents().filter(d=>d.cat=='キャラクター');if(!cs.length)return alert('辞書タブでカテゴリ「キャラクター」の項目を追加すると、ここから選べます。');
 const sel=document.createElement('select');sel.size=Math.min(9,cs.length+1);sel.style.cssText=`position:fixed;left:${e.clientX}px;top:${e.clientY}px;z-index:9`;
 sel.innerHTML='<option value="">(指定なし)</option>'+cs.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');
 sel.onchange=()=>{const k=s.dataset.k,m=mine().speakers,o=m[k],v=sel.value;sel.remove();act(()=>m[k]=[v,Date.now()],()=>o?m[k]=o:delete m[k],1)};
 sel.onblur=()=>sel.remove();document.body.append(sel);sel.focus()};

/* ---- 書き込み ---- */
function act(d,u,full,run=1,p=myp()){if(run)d();hist.push({d,u,full,p});reds=[];fin(p,full)}
const fin=(p,full)=>{mk(p);save();full?render():paintAll()};
const undo=()=>{const x=hist.pop();if(x){x.u();reds.push(x);fin(x.p,x.full)}},redo=()=>{const x=reds.pop();if(x){x.d();hist.push(x);fin(x.p,x.full)}};
const addS=s=>{s.id=id('s');const L=mine();act(()=>L.strokes.push(s),()=>L.strokes.splice(L.strokes.indexOf(s),1))};
const erasedSet=()=>new Set(Object.values(S.layers).flatMap(u=>u[S.cur]?.erased||[]));
const vis=i=>{const er=erasedSet();return Object.entries(S.layers).flatMap(([u,l])=>(l[S.cur]?.strokes||[]).filter(s=>s.pg==i&&!er.has(s.id)).map(s=>({s,u}))).sort((a,b)=>a.s.id<b.s.id?-1:1)};
const paint=i=>{const g=$$('#area canvas')[i]?.g;if(!g)return;g.clearRect(0,0,W,H);vis(i).forEach(o=>draw(g,o.s))},paintAll=()=>$$('#area canvas').forEach((_,i)=>paint(i));
const ds=(x,y,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/l));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)};
function hit(s,x,y){const p=s.p;
 if(FREE.includes(s.t)||s.t=='line'||s.t=='arrow'){const r=s.w*(s.t=='marker'?1.5:.5)+8;return p.some((a,i)=>ds(x,y,a,p[i+1]||a)<r)}
 if(s.t=='rect'){const[a,b]=p,c=[[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]]];return c.some((u,i)=>ds(x,y,u,c[(i+1)%4])<8)}
 if(s.t=='ellipse'){const[a,b]=p,v=Math.hypot((x-(a[0]+b[0])/2)/(Math.abs(b[0]-a[0])/2+1),(y-(a[1]+b[1])/2)/(Math.abs(b[1]-a[1])/2+1));return Math.abs(v-1)<.25}
 const X=p.map(a=>a[0]),Y=p.map(a=>a[1]);return x>Math.min(...X)-6&&x<Math.max(...X)+6&&y>Math.min(...Y)-6&&y<Math.max(...Y)+6}
function erase(i,[x,y],ers){const M=mine(),all=$('#es').value=='all';
 for(const{s,u}of vis(i).reverse()){if(!hit(s,x,y))continue;let o;
  if(u==S.me){const k=M.strokes.indexOf(s);o={d:()=>M.strokes.splice(M.strokes.indexOf(s),1),u:()=>M.strokes.splice(k,0,s)}}
  else if(all)o={d:()=>M.erased.push(s.id),u:()=>M.erased.splice(M.erased.indexOf(s.id),1)};
  if(o){o.d();ers.push(o);fin(myp(),0);break}}}
function draw(g,s){const p=s.p,t=s.t;g.save();g.strokeStyle=g.fillStyle=s.c;g.lineWidth=s.w;g.lineCap=g.lineJoin='round';
 if(t=='pen'){g.lineWidth=Math.max(1,s.w*.6);g.globalAlpha=.9}
 if(t=='marker'){g.globalAlpha=.4;g.lineWidth=s.w*3;g.lineCap='butt'}
 if(t=='brush'){for(let i=1;i<p.length;i++){g.lineWidth=s.w*(p[i][2]||1);g.beginPath();g.moveTo(p[i-1][0],p[i-1][1]);g.lineTo(p[i][0],p[i][1]);g.stroke()}if(p.length<2){g.beginPath();g.arc(p[0][0],p[0][1],s.w/2,0,7);g.fill()}}
 else if(FREE.includes(t)){g.beginPath();p.forEach((a,i)=>i?g.lineTo(a[0],a[1]):g.moveTo(a[0],a[1]));if(p.length==1)g.lineTo(p[0][0]+.1,p[0][1]);g.stroke()}
 else if(t=='line'||t=='arrow'){const[a,b]=p;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);if(t=='arrow'){const r=Math.atan2(b[1]-a[1],b[0]-a[0]),L=10+s.w*2;for(const d of[2.6,-2.6]){g.moveTo(b[0],b[1]);g.lineTo(b[0]+L*Math.cos(r+d),b[1]+L*Math.sin(r+d))}}g.stroke()}
 else if(t=='rect')g.strokeRect(p[0][0],p[0][1],p[1][0]-p[0][0],p[1][1]-p[0][1]);
 else if(t=='ellipse'){g.beginPath();g.ellipse((p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2,Math.abs(p[1][0]-p[0][0])/2,Math.abs(p[1][1]-p[0][1])/2,0,0,7);g.stroke()}
 else if(t=='tpl'){const[a,b]=p;g.fillStyle=s.c+'22';g.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);g.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);g.fillStyle=s.c;g.font='bold 13px sans-serif';g.textBaseline='top';s.s.split('|').forEach((l,i)=>g.fillText(l,Math.min(a[0],b[0])+5,Math.min(a[1],b[1])+4+i*17))}
 else if(t=='text'){const z=10+s.w*1.5;g.font=z+'px sans-serif';g.textBaseline='top';s.s.split('|').forEach((l,i)=>g.fillText(l,p[0][0],p[0][1]+i*z*1.3))}
 g.restore()}
function bind(pg){const cv=pg.querySelector('canvas'),g=cv.getContext('2d');cv.g=g;g.scale(2,2);let cur,ers;
 const q=e=>{const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*W/r.width),Math.round((e.clientY-r.top)*H/r.height)]};
 cv.onpointerdown=e=>{if(!need())return;const p=q(e);
  if(tool=='text'){const s=prompt('メモ内容（ | で改行）');if(s){const z=10+wd()*1.5,L=s.split('|');addS({t:'text',pg:pg.i,c:col(),w:wd(),s,p:[p,[p[0]+Math.max(...L.map(x=>x.length))*z,p[1]+L.length*z*1.3]]})}return}
  cv.setPointerCapture(e.pointerId);
  if(tool=='eraser'){ers=[];erase(pg.i,p,ers);return}
  cur={id:'',t:tool,pg:pg.i,c:col(),w:wd(),p:FREE.includes(tool)?[p]:[p,p]};if(tool=='tpl')cur.s=$('#tp').value};
 cv.onpointermove=e=>{const p=q(e);if(ers)return erase(pg.i,p,ers);if(!cur)return;
  if(FREE.includes(cur.t)){const l=cur.p.at(-1);if(cur.t=='brush')p.push(Math.max(.4,Math.min(2,2.2-Math.hypot(p[0]-l[0],p[1]-l[1])/6)));cur.p.push(p)}else cur.p[1]=p;
  paint(pg.i);draw(g,cur)};
 cv.onpointerup=cv.onpointercancel=()=>{
  if(ers){if(ers.length){const a=ers;act(()=>a.forEach(x=>x.d()),()=>[...a].reverse().forEach(x=>x.u()),0,0)}ers=null;return}
  if(!cur)return;const s=cur;cur=null;
  if(s.t=='tpl'){const[a,b]=s.p;if(Math.abs(b[0]-a[0])<20||Math.abs(b[1]-a[1])<14)s.p[1]=[a[0]+150,a[1]+28];if(s.s.includes('自由')){const t=prompt('メモ内容（ | で改行）');if(!t)return paint(pg.i);s.s=t}}
  addS(s)}}
