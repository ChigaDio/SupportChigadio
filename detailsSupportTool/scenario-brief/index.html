<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>シナリオ演出依頼資料集</title>
<style>
:root{--b:#2f5d8a;--bg:#e9ebee;--tx:#222;--pn:#fff;--bd:#cfd5dc}
@media(prefers-color-scheme:dark){:root{--bg:#1d2126;--tx:#e6e8ea;--pn:#2a2f36;--bd:#454c55}}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
header,.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}
button,select,input,textarea{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
input[type=color]{padding:0;width:34px;height:28px}input[type=range]{padding:0;width:90px}
button{cursor:pointer}button.on{background:var(--b);color:#fff;border-color:var(--b)}
.sw{width:22px;height:22px;padding:0;border-radius:50%}
section{display:none}section.on{display:block}
#area{padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow:auto}
.pg{position:relative;width:793px;height:1122px;background:#fff;color:#222;padding:60px 56px;overflow:hidden;box-shadow:0 2px 10px #0003;flex:none}
.pb{height:100%;overflow:hidden;font:16px/1.9 "Hiragino Mincho ProN","Yu Mincho",serif}
.pb p{margin:0;min-height:1.9em}
canvas{position:absolute;left:0;top:0;width:793px;height:1122px;touch-action:none;mix-blend-mode:multiply;cursor:crosshair}
.sel canvas{pointer-events:none}
.dl{background:#fff3b8;border-radius:3px}.sel .dl{cursor:pointer}.sel .dl:hover{outline:2px solid var(--b)}
.sp{font:700 11px sans-serif;color:#fff;border-radius:3px;padding:1px 5px;margin-right:2px;vertical-align:2px}
.pn{position:absolute;right:20px;bottom:14px;font:11px sans-serif;color:#999}

.wrap{max-width:900px;margin:0 auto;padding:12px}

#dp{display:none}

.cvs{font-size:20px;letter-spacing:.3em;line-height:2.1;border-top:3px solid #1f3a6e;padding-top:18px;width:max-content}
.cvl{margin:60px 0 0;padding:0;list-style:none;counter-reset:n;font-size:15px;line-height:2.3;flex:1;overflow:hidden}
.cvl li{counter-increment:n;border-bottom:1px solid #d3d8e0}.cvl li::before{content:"第" counter(n,cjk-decimal) "章　";color:#1f3a6e;font-weight:600}
.cvf{font:12px/1.8 system-ui,sans-serif;color:#667}
[hidden]{display:none!important}
.pg{padding:0}
.hd{position:absolute;left:56px;right:40px;top:28px;height:36px;border-bottom:2px solid #1f3a6e;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:6px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.hd b{font-size:15px;letter-spacing:.14em;color:#1f3a6e}.hd i{font:italic 600 13px Georgia,serif;color:#1f3a6e}
.dv{position:absolute;top:72px;height:988px;border-left:1.5px solid #1f3a6e}
.memo{position:absolute;top:84px;right:40px;height:960px;background:linear-gradient(#0000 29px,#dfe4ec 29px) 0 0/100% 30px}
.memo span{position:absolute;top:-17px;left:2px;font:600 10px sans-serif;letter-spacing:.3em;color:#1f3a6e}
.pb{position:absolute;left:56px;top:84px;height:960px;overflow:hidden;font:15px/30px "Hiragino Mincho ProN","Yu Mincho",serif;outline:0}
.pb p{margin:0;min-height:30px;position:relative}
.pb p::before{content:attr(data-n);position:absolute;left:-32px;width:26px;text-align:right;font:10px/30px sans-serif;color:#a3adbf}
.pn{right:auto;left:56px;bottom:20px;font:10px sans-serif;letter-spacing:.12em;color:#8a94a6}
.pf{position:absolute;right:40px;bottom:12px;display:flex;gap:6px}.pf button{font-size:11px;padding:2px 6px}
.nc canvas{pointer-events:none}.t-move canvas{cursor:default}
.t-sel .dl{cursor:pointer}.t-sel .dl:hover{outline:2px solid var(--b)}
.t-edit .pb{outline:2px dashed #2f9bff44;overflow:visible;cursor:text}
.t-brk .pb p{cursor:cell}.t-brk .pb p:hover{box-shadow:inset 0 2px #e11d48}
#pp{position:fixed;right:14px;bottom:14px;width:318px;z-index:20;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px;display:grid;gap:6px;box-shadow:0 6px 24px #0004}
#pp .r{display:flex;flex-wrap:wrap;gap:4px;align-items:center}#pp textarea{width:100%}
#pp [data-b].on{background:var(--b);color:#fff}
#uv label{margin-left:6px}
@media print{#area{zoom:1!important}}
.mk{background:#ffe9a8}.pb{font-size:var(--fs,15px)}.t-sel .dl:not(.has){outline:1px dashed #e11d48}@media print{.mk{background:none!important}}
#area .pg{transform:scale(var(--k,1));transform-origin:top center;margin:0 calc((var(--k,1) - 1)*396.5px) calc((var(--k,1) - 1)*1122px)}
.pg canvas{touch-action:pan-x pan-y pinch-zoom;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#area[data-fd="1"] .pg canvas{touch-action:none}
#lib{position:fixed;left:14px;top:120px;bottom:14px;width:350px;z-index:21;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 24px #0004}
#lib .r{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#lg{overflow:auto;flex:1}#lg h4{margin:8px 0 4px;font-size:12px;display:flex;justify-content:space-between;gap:6px;word-break:break-all}
#lg .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.th{border:1px solid var(--bd);border-radius:6px;padding:3px;font-size:10px;cursor:grab;overflow:hidden;word-break:break-all}.th img{width:100%;height:68px;object-fit:contain;background:#fff;display:block;pointer-events:none}
@media print{#area{--k:1!important}}
@media(pointer:coarse){button,select,input:not([type=range]):not([type=checkbox]){min-height:38px}.sw{width:34px;height:34px}}
@media(max-width:640px){#pp,#lib{left:8px;right:8px;width:auto}}
#ex{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:center;justify-content:center}
#ex .exb{background:var(--pn);width:min(860px,96vw);height:min(640px,92vh);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
#ex .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#xls{flex:1;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px}
.xd{padding:6px 8px;cursor:pointer;border-radius:6px}.xd:hover{background:#2f5d8a22}
.xg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:8px}.th.on{outline:3px solid var(--b)}
</style></head><body>
<header class="np"><b>演出依頼資料集</b>
<label>名前 <input id="me" size="8" placeholder="自分の名前"></label>
<select id="ch"></select>
<span class="tabs"><button data-t="cv">表紙</button> <button data-t="v">資料</button> <button data-t="t">本文</button> <button data-t="d1">世界観</button> <button data-t="d2">用語</button> <button data-t="d3">キャラクター</button></span>
<span style="flex:1"></span>
<button id="rl" title="git pull のあとなどに、ディスクの内容を読み直します">🔄 再読込</button>
<label><input type="checkbox" id="wd"> 辞書も出力</label><button id="pr">📄 PDF出力(A4)</button><span id="st" class="hint"></span></header>

<div id="cp"></div>
<section id="cv" class="np"><div class="bar"><label>プロジェクト名 <input id="pj" size="26" placeholder="例：星降る町のレクイエム"></label><span class="hint">この名前から表紙が作られ、PDFの1枚目になります</span></div><div id="cvr"></div></section>
<section id="v"><div class="bar np" id="tb"></div><div id="area"></div></section>

<section id="t" class="np"><div class="wrap"><div class="bar"><button id="nc">＋新しい章</button><input id="ti" placeholder="章タイトル" style="flex:1"><button id="cu">↑ 前へ</button><button id="cd">↓ 後ろへ</button><button id="cx">🗑 この章を削除</button></div>
<div class="hint">小説をそのまま貼り付け。「---」だけの行で強制改ページ。本文を直すと書き込みの位置がずれることがあります。</div>
<textarea id="tx" placeholder="ここに小説をコピペ"></textarea></div></section>
<section id="d" class="np"><div class="wrap"><h2 id="dh"></h2><div class="hint" id="dn"></div><div class="bar"><button id="na"></button>
<label><input type="checkbox" id="fh" checked> 今の章＋共通のみ</label><input id="fq" placeholder="検索"></div><div id="dl"></div></div></section>
<div id="ex" class="np" hidden><div class="exb"><div class="r"><b>📂 サーバー上の画像を選ぶ</b><span style="flex:1"></span><button id="xcl">✕</button></div>
<div class="r"><button id="xup">⬆ 上へ</button><button id="xhm">🏠 データフォルダ</button><select id="xdr" hidden></select><input id="xpa" style="flex:1;min-width:160px" title="パスを直接入力してEnter"><button id="xgo">移動</button></div>
<div id="xls"></div><div class="r"><button id="xfo">📁 このフォルダを登録</button><button id="xfi">🗎 選んだ画像を登録</button><span class="hint" id="xin"></span></div></div></div>
<div id="lib" class="np" hidden><div class="r"><b>🖼 画像ライブラリ</b><span style="flex:1"></span><button id="lcl">✕</button></div>
<div class="r"><button id="lup">📤 アップロード</button><button id="lfo">📂 サーバーから選ぶ</button><button id="lrl">🔄 再読込</button></div>
<div class="hint">アップロード＝ scenario-data/images にコピー。「サーバーから選ぶ」＝サーバー上のどこでもエクスプローラー風に辿って選べ、コピーせず相対パス(例 ../art/a.png。別ドライブ等は絶対パス)だけを保存。クリックで配置、ドラッグで好きな位置へ置けます。</div><div id="lg"></div></div>
<div id="pp" class="np" hidden><textarea class="tx" id="pt" rows="3" placeholder="テキスト（改行OK）"></textarea>
<div class="r tx"><select id="pf"><option value="sans">ゴシック</option><option value="serif">明朝</option><option value="hand">手書き風</option><option value="mono">等幅</option></select><input id="pz" type="number" min="8" max="96" style="width:58px" title="文字サイズ"><button data-b="b"><b>B</b></button><button data-b="i"><i>I</i></button><button data-b="u"><u>U</u></button><select id="pa"><option value="l">左寄せ</option><option value="c">中央</option><option value="r">右寄せ</option></select></div>
<div class="r"><label data-for="text"><input type="checkbox" id="pd"> 枠線</label><label data-for="text rect ellipse poly">塗り<input type="color" id="pl" value="#fff59d"></label><button id="pln" data-for="text rect ellipse poly">塗りなし</button><select id="ds" data-for="text rect ellipse line arrow curve poly" title="線の種類"><option value="0">実線</option><option value="1">破線</option><option value="2">点線</option></select><select id="ah" data-for="line arrow curve poly" title="矢じり"><option value="n">矢じりなし</option><option value="e">終点→</option><option value="s">←始点</option><option value="b">←→両端</option></select></div>
<div class="r"><button id="ro" data-for="img" title="画像本来の縦横比に戻す">元の縦横比</button><select id="rt" data-for="img" title="枠の縦横比を変える"><option value="">比率…</option><option value="1">1:1</option><option value="1.3333">4:3</option><option value="1.7778">16:9</option><option value="0.75">3:4</option><option value="0.5625">9:16</option></select><label data-for="img"><input type="checkbox" id="fx"> 比率固定</label><label data-for="img"><input type="checkbox" id="ct"> トリミング</label></div>
<div class="r"><label data-for="poly"><input type="checkbox" id="pcl"> 閉じる(多角形)</label><label data-for="img">透明度<input type="range" id="po" min="10" max="100"></label><button id="pfr">前面へ</button><button id="pbk">背面へ</button><button id="pcp">コピー</button></div>
<div class="r"><label>色<input type="color" id="pc"></label><label>線<input type="range" id="pw" min="1" max="24"></label><button id="pdup">複製</button><button id="pdel">🗑削除</button></div>
<div class="hint">ドラッグで移動、四隅で拡大縮小。「吸着」ONで、行・他の図形・余白線にピタッと揃います。</div></div>
<div id="dp"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=793,H=1122,id=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const h=s=>{let x=0;for(const c of s)x=Math.imul(31,x)+c.charCodeAt(0)|0;return(x>>>0).toString(36)};
const CATS=['世界観','用語','キャラクター','章設定'],FREE=['pen','marker','brush'];
const TPL=['BGM','SE','背景','暗転','立ち絵','表情','カメラ','演出','動き','ウェイト','カット番号','付箋','自由メモ…'],COL=['#e11d48','#2563eb','#16a34a','#facc15','#111827'];
const TOOLS=[['move','↖選択・移動'],['pen','✏️鉛筆'],['marker','🖍マーカー'],['brush','🖌筆'],['line','／線'],['arrow','→矢印'],['curve','〰曲線矢印'],['poly','⟋折れ線'],['rect','▭四角'],['ellipse','◯丸'],['text','Ｔ文字ボックス'],['tpl','🏷演出ラベル'],['eraser','🧽消しゴム'],['sel','👆話者指定'],['done','✔対応済み'],['edit','✎本文編集'],['brk','✂改ページ']];
let S={me:'',project:'',chapters:{},dict:{},layers:{}};
let tool='pen',dirty=new Set(),hist=[],reds=[],tm,sel=null,gd=null,pt0=null,stamp,pcur=null,bust=0,CLIP=null,pcnt=0,penDown=0,penSeen=0,FD=navigator.maxTouchPoints>0&&!matchMedia('(any-pointer:fine)').matches;
const chs=()=>Object.values(S.chapters).sort((a,b)=>a.order-b.order||(a.id<b.id?-1:1)),cp=()=>S.chapters[S.cur];
const lay=(u,c)=>((S.layers[u]??={})[c]??={erased:[],speakers:{},done:{},strokes:[]}),mine=()=>lay(S.me,S.cur);
const myp=()=>`users/${S.me}/${S.cur}.json`,mk=p=>dirty.add(p);
const need=()=>S.me?1:(alert('上の「名前」欄に自分の名前を入力してください。書き込みは名前ごとに保存されます。'),0);
const col=()=>$('#co').value,wd=()=>+$('#wi').value;

/* ---- 保存 (Pythonサーバー経由で1ファイル=1作者/1章/1項目。他人のファイルは書き換えない) ---- */
const api=(m,u,b)=>fetch(u,{method:m,body:b}).then(r=>{if(!r.ok)throw Error(r.status);return r});
const J=o=>JSON.stringify(o,null,1)+'\n';
const jl=l=>`{\n"erased":${JSON.stringify(l.erased)},\n"speakers":${JSON.stringify(Object.fromEntries(Object.entries(l.speakers).sort()))},\n"done":${JSON.stringify(Object.fromEntries(Object.entries(l.done||{}).sort()))},\n"strokes":[\n${l.strokes.map(s=>JSON.stringify(s)).join(',\n')}\n]\n}\n`;
function cont(p){if(p=='project.json')return J({name:S.project,memoW:S.memoW,fs:S.fs,imgRefs:S.imgRefs});const[a,b,c]=p.split('/'),k=(b||'').slice(0,-5);
 if(a=='chapters')return S.chapters[k]?J(S.chapters[k]):null;if(a=='dictionary')return S.dict[k]?J(S.dict[k]):null;const l=S.layers[b]?.[c.slice(0,-5)];return l?jl(l):null}
function save(){clearTimeout(tm);tm=setTimeout(flush,400);$('#st').textContent='…'}
async function flush(){try{for(const p of[...dirty]){const t=cont(p);await api(t==null?'DELETE':'PUT','/api/file?path='+encodeURIComponent(p),t);dirty.delete(p)}stamp=await(await api('GET','/api/stamp')).text();$('#st').textContent='保存済み'}catch(e){$('#st').textContent='保存失敗: '+e.message}}
async function load(){const c=S.cur;S=await(await api('GET','/api/all')).json();S.cur=c;hist=[];reds=[];stamp=await(await api('GET','/api/stamp')).text()}
$('#rl').onclick=async()=>{await flush();await load();init()};

/* ---- タブ・章・表紙 ---- */
let ct,dcat=CATS[0];
function tab(t){ct=t;const s=t[0]=='d'?'d':t;if(s=='d')dcat=CATS[t[1]-1];
 $$('section').forEach(x=>x.classList.toggle('on',x.id==s));$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
 if(s=='cv'){$('#pj').value=S.project||'';$('#cvr').innerHTML=coverHtml()}if(s=='v')render();if(s=='t'){$('#ti').value=cp()?.title||'';$('#tx').value=cp()?.text||''}if(s=='d')renderDict()}
$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function chSel(){if(!(S.cur in S.chapters))S.cur=chs()[0]?.id;$('#ch').innerHTML=chs().map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');$('#ch').value=S.cur||''}
function init(){chSel();$('#me').value=S.me||'';tab(ct||'cv')}
$('#ch').onchange=()=>{S.cur=$('#ch').value;hist=[];reds=[];tab(ct)};
$('#me').onchange=()=>{S.me=$('#me').value.replace(/[\\/:*?"<>|\s]/g,'_');$('#me').value=S.me;api('PUT','/api/me',S.me)};
const coverHtml=()=>{const t=S.project||'無題のプロジェクト',us=Object.keys(S.layers).filter(u=>u);
 return `<div class="pg cover"><div class="cvb"><div class="cvt" style="font-size:${t.length>12?38:54}px">${esc(t)}</div></div><div class="cvm"><div class="cvs">シナリオスクリプト<br>演出依頼資料集</div><ol class="cvl">${chs().map(c=>`<li>${esc(c.title)}</li>`).join('')}</ol><div class="cvf">${new Date().toLocaleDateString('ja-JP')}<br>${us.map(esc).join(' / ')}</div></div></div>`};
$('#pj').oninput=()=>{S.project=$('#pj').value;mk('project.json');save();$('#cvr').innerHTML=coverHtml()};
$('#nc').onclick=()=>{const t=prompt('章タイトル');if(!t)return;const i=id('c');S.chapters[i]={id:i,title:t,order:chs().length?Math.max(...chs().map(c=>c.order))+1:1,text:''};S.cur=i;mk(`chapters/${i}.json`);save();init();tab('t')};
$('#tx').oninput=()=>{if(cp()){cp().text=$('#tx').value;mk(`chapters/${S.cur}.json`);save()}};
$('#ti').oninput=()=>{if(cp()){cp().title=$('#ti').value;mk(`chapters/${S.cur}.json`);save();chSel()}};
/* 並べ替えは前後の章のorderの中間値を入れるだけ → 書き換わるファイルは動かした章の1つだけ */
function mv(dn){const a=chs(),i=a.findIndex(c=>c.id==S.cur),j=dn?i+1:i-1;if(i<0||j<0||j>=a.length)return;const lo=a[dn?j:j-1],hi=a[dn?j+1:j];
 S.chapters[S.cur].order=lo?(hi?(lo.order+hi.order)/2:lo.order+1):hi.order-1;mk(`chapters/${S.cur}.json`);save();chSel()}
$('#cu').onclick=()=>mv(0);$('#cd').onclick=()=>mv(1);
$('#cx').onclick=()=>{const c=cp();if(!c||!confirm(`「${c.title}」を削除しますか？\n自分の書き込みも消えます（他の人の書き込みファイルは残ります）`))return;const i=S.cur;
 delete S.chapters[i];mk(`chapters/${i}.json`);if(S.layers[S.me]?.[i]){delete S.layers[S.me][i];mk(`users/${S.me}/${i}.json`)}S.cur=undefined;hist=[];reds=[];save();init()};

function copyS(){if(sel){CLIP=clone(sel);pcnt=0;$('#st').textContent='コピーしました'}}
function pasteS(){if(!CLIP||!need())return;const pi=curPage();if(pi<0)return;pcnt++;const n=clone(CLIP),d=CLIP.pg==pi?14*pcnt:0,M=mine();n.id=id('s');n.pg=pi;n.p=n.p.map(a=>[a[0]+d,a[1]+d,...a.slice(2)]);sel=n;act(()=>M.strokes.push(n),()=>M.strokes.splice(M.strokes.indexOf(n),1))}
$('#pcp').onclick=copyS;$('#pst').onclick=pasteS;$('#pok').onclick=()=>polyEnd();

const KEYS={v:'move',p:'pen',m:'marker',b:'brush',l:'line',a:'arrow',c:'curve',r:'rect',o:'ellipse',t:'text',e:'eraser',d:'done',g:'poly'};
setInterval(async()=>{try{const a=document.activeElement,t=await(await api('GET','/api/stamp')).text();if(!stamp||t==stamp||dirty.size||sel||(a&&(/INPUT|TEXTAREA|SELECT/.test(a.tagName)||a.isContentEditable)))return;await load();init();$('#st').textContent='他の人の更新を反映しました'}catch{}},8000);
onkeydown=e=>{if(!$('#v').classList.contains('on')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
 if(pcur&&e.key=='Enter')return polyEnd();if(pcur&&e.key=='Escape'){pcur=null;return paintAll()}
 if((e.key=='Delete'||e.key=='Backspace')&&sel){e.preventDefault();return delS()}
 if(!(e.ctrlKey||e.metaKey||e.altKey)&&KEYS[e.key.toLowerCase()]&&!e.repeat)return setTool(KEYS[e.key.toLowerCase()]);
 if(sel&&e.key.startsWith('Arrow')){e.preventDefault();const d=e.shiftKey?10:1,[dx,dy]={ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[e.key],s=sel,o=clone(s.p);return act(()=>{s.p=o.map(a=>[a[0]+dx,a[1]+dy,...a.slice(2)])},()=>{s.p=clone(o)},0)}
 if(!(e.ctrlKey||e.metaKey))return;if(e.key=='c'&&sel){copyS();return}if(e.key=='x'&&sel){copyS();return delS()}if(e.key=='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key=='y')redo()};
