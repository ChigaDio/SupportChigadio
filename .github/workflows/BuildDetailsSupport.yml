name: Build DetailsSupport tools into their tool folders

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS app bundles
        required: false
        default: true
        type: boolean
      build_windows:
        description: Build Windows executables
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ChigaDio/SupportChigadio
          ref: main

      - name: Verify repository structure
        shell: bash
        run: |
          set -euxo pipefail
          ls -la
          test -d detailsSupportTool
          find detailsSupportTool -maxdepth 2 -print | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller

          while IFS= read -r req; do
            [ -n "$req" ] || continue
            echo "Installing requirements from: $req"
            python -m pip install -r "$req"
          done < <(find detailsSupportTool -type f -name "requirements.txt" -print | sort)

      - name: Build macOS app bundles into each tool folder
        shell: bash
        run: |
          set -euxo pipefail

          for tool_dir in detailsSupportTool/*; do
            [ -d "$tool_dir" ] || continue

            script=""
            for candidate in "$tool_dir"/*.py; do
              [ -f "$candidate" ] || continue
              case "$(basename "$candidate")" in
                "__init__.py") continue ;;
              esac
              script="$candidate"
              break
            done

            [ -n "$script" ] || continue

            tool_name="$(basename "$tool_dir")"

            # 既存の .app を削除しておく
            existing_app="$tool_dir/$tool_name.app"
            if [ -e "$existing_app" ]; then
              rm -rf "$existing_app"
            fi

            # 一時出力先を使う（同じパスに mv しない）
            temp_out="$tool_dir/.build_macos_out"
            rm -rf "$temp_out"
            mkdir -p "$temp_out"

            work_dir="$tool_dir/.build_macos_work"
            rm -rf "$work_dir"
            mkdir -p "$work_dir"

            echo "Building macOS app for: $tool_name"
            pyinstaller \
              --noconfirm \
              --clean \
              --name "$tool_name" \
              --distpath "$temp_out" \
              --workpath "$work_dir" \
              --specpath "$work_dir" \
              --onedir \
              --windowed \
              "$script"

            built_app="$temp_out/$tool_name.app"
            if [ -d "$built_app" ]; then
              cp -R "$built_app" "$tool_dir/"
            fi
          done

          find detailsSupportTool -maxdepth 2 -print | sort

      - name: Commit macOS artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code -- detailsSupportTool; then
            echo "No macOS changes to commit."
            exit 0
          fi

          git add detailsSupportTool
          git commit -m "Build macOS DetailsSupport apps"
          git push origin HEAD:${{ github.ref_name }}

  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ChigaDio/SupportChigadio
          ref: main

      - name: Verify repository structure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem
          Test-Path "detailsSupportTool"
          Get-ChildItem -Path "detailsSupportTool" -Recurse | Select-Object FullName

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller

          Get-ChildItem -Path "detailsSupportTool" -Recurse -File -Filter "requirements.txt" | ForEach-Object {
            Write-Host "Installing requirements from: $($_.FullName)"
            python -m pip install -r $_.FullName
          }

      - name: Build Windows executables into each tool folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Get-ChildItem -Path "detailsSupportTool" -Directory | ForEach-Object {
            $toolDir = $_.FullName
            $toolName = $_.Name

            $script = Get-ChildItem -Path $toolDir -File -Filter "*.py" |
              Where-Object { $_.Name -ne "__init__.py" } |
              Select-Object -First 1

            if (-not $script) {
              return
            }

            # 既存 exe を削除
            $existingExe = Join-Path $toolDir "$toolName.exe"
            if (Test-Path $existingExe) {
              Remove-Item $existingExe -Force
            }

            # 一時出力先
            $tempOut = Join-Path $toolDir ".build_windows_out"
            Remove-Item -Recurse -Force $tempOut -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $tempOut | Out-Null

            $workDir = Join-Path $toolDir ".build_windows_work"
            Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $workDir | Out-Null

            Write-Host "Building Windows exe for: $toolName"
            pyinstaller `
              --noconfirm `
              --clean `
              --name $toolName `
              --distpath $tempOut `
              --workpath $workDir `
              --specpath $workDir `
              --onefile `
              --windowed `
              $script.FullName

            $generatedExe = Join-Path $tempOut "$toolName.exe"
            if (Test-Path $generatedExe) {
              Copy-Item $generatedExe $existingExe
            }
          }

          Get-ChildItem -Path "detailsSupportTool" -Recurse -File -Filter "*.exe" | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Commit Windows artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code -- detailsSupportTool; then
            echo "No Windows changes to commit."
            exit 0
          fi

          git add detailsSupportTool
          git commit -m "Build Windows DetailsSupport executables"
          git push origin HEAD:${{ github.ref_name }}
