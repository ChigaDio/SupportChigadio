
name: Build all DetailsSupport tools into their tool folders

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS app bundles
        required: false
        default: true
        type: boolean
      build_windows:
        description: Build Windows executables
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # ==================================================
  # macOS build
  # ==================================================
  build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ChigaDio/SupportChigadio
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller
          while IFS= read -r req; do
            [ -n "$req" ] || continue
            echo "Installing requirements from: $req"
            python -m pip install -r "$req"
          done < <(
            find detailsSupportTool \
              -type f \
              -name "requirements.txt" \
              -not -path "*/.build_*/*" \
              -print | sort
          )

      - name: Remove old build directories
        shell: bash
        run: |
          set -euo pipefail
          find detailsSupportTool \
            -depth \
            -type d \
            -name ".build_*" \
            -exec rm -rf {} +

      - name: Build macOS applications
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/detailsSupportTool"
          TEMP_ROOT="$RUNNER_TEMP/details-support-macos"
          rm -rf "$TEMP_ROOT"
          mkdir -p "$TEMP_ROOT"
          built_count=0
          for tool_dir in "$ROOT"/*; do
            [ -d "$tool_dir" ] || continue
            tool_name="$(basename "$tool_dir")"
            # Find Python entry point.
            py_script=""
            for candidate in \
              "$tool_dir/main.py" \
              "$tool_dir/server.py"; do
              if [ -f "$candidate" ]; then
                py_script="$candidate"
                break
              fi
            done
            if [ -z "$py_script" ]; then
              while IFS= read -r candidate; do
                [ -f "$candidate" ] || continue
                [ "$(basename "$candidate")" = "__init__.py" ] && continue
                py_script="$candidate"
                break
              done < <(
                find "$tool_dir" \
                  -maxdepth 1 \
                  -type f \
                  -name "*.py" \
                  -print | sort
              )
            fi
            if [ -z "$py_script" ]; then
              echo "Skipping $tool_name: no Python entry point found"
              continue
            fi
            tool_temp="$TEMP_ROOT/$tool_name"
            dist_dir="$tool_temp/dist"
            work_dir="$tool_temp/work"
            spec_dir="$tool_temp/spec"
            mkdir -p "$dist_dir" "$work_dir" "$spec_dir"
            echo "========================================"
            echo "Building macOS app: $tool_name"
            echo "Entry point: $py_script"
            echo "========================================"
            python -m PyInstaller \
              --noconfirm \
              --clean \
              --name "$tool_name" \
              --distpath "$dist_dir" \
              --workpath "$work_dir" \
              --specpath "$spec_dir" \
              --onedir \
              --windowed \
              "$py_script"
            built_app="$dist_dir/$tool_name.app"
            target_app="$tool_dir/$tool_name.app"
            if [ ! -d "$built_app" ]; then
              echo "::error::App bundle was not generated: $built_app"
              exit 1
            fi
            if [ ! -f "$built_app/Contents/Info.plist" ]; then
              echo "::error::Invalid app bundle: $built_app"
              exit 1
            fi
            # Replace only the final app bundle.
            rm -rf "$target_app"
            ditto "$built_app" "$target_app"
            if [ ! -f "$target_app/Contents/Info.plist" ]; then
              echo "::error::App bundle copy failed: $target_app"
              exit 1
            fi
            echo "Created: $target_app"

            # Generate the launcher shell script.
            launcher="$tool_dir/run_${tool_name}.sh"
            cat > "$launcher" <<'LAUNCHER_EOF'
          #!/bin/bash
          # Auto-generated launcher for __TOOL__ (macOS)
          DIR="$(cd "$(dirname "$0")" && pwd)"

          # Install requirements.txt if it exists next to this script.
          if [ -f "$DIR/requirements.txt" ]; then
            PY="$(command -v python3 || command -v python || true)"
            if [ -n "$PY" ]; then
              echo "Installing requirements..."
              "$PY" -m pip install -q -r "$DIR/requirements.txt" \
                || echo "Warning: failed to install requirements"
            else
              echo "Warning: Python not found; skipping requirements install"
            fi
          fi

          open "$DIR/__TOOL__.app"
          LAUNCHER_EOF
            sed -i '' "s/__TOOL__/${tool_name}/g" "$launcher"
            chmod +x "$launcher"
            echo "Created: $launcher"

            built_count=$((built_count + 1))
          done
          if [ "$built_count" -eq 0 ]; then
            echo "::error::No macOS applications were built."
            exit 1
          fi
          echo "Successfully built $built_count macOS applications."

      - name: Commit and push macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage generated apps, launchers and cleanup changes first.
          git add -A -- detailsSupportTool
          # Make sure launcher scripts keep the executable bit in git.
          while IFS= read -r sh_file; do
            git update-index --chmod=+x -- "$sh_file"
          done < <(find detailsSupportTool -maxdepth 2 -type f -name "run_*.sh" -print)
          if git diff --cached --quiet; then
            echo "No macOS changes to commit"
          else
            git diff --cached --stat
            git commit -m "Build macOS DetailsSupport apps and launchers"
          fi
          # Rebase only after the working tree is clean.
          git fetch origin main
          git rebase origin/main
          # Push the resulting commit to main.
          git push origin HEAD:main

  # ==================================================
  # Windows build
  # ==================================================
  build-windows:
    needs: build-macos
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.build_windows
      }}
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ChigaDio/SupportChigadio
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upgrade pip"
          }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install PyInstaller"
          }
          Get-ChildItem `
            -Path "detailsSupportTool" `
            -Recurse `
            -File `
            -Filter "requirements.txt" |
            Where-Object {
              $_.FullName -notmatch '[\\/]\.build_[^\\/]*[\\/]'
            } |
            ForEach-Object {
              Write-Host "Installing requirements from: $($_.FullName)"
              python -m pip install -r $_.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to install $($_.FullName)"
              }
            }

      - name: Remove old build directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $oldDirs = @(
            Get-ChildItem `
              -Path "detailsSupportTool" `
              -Directory `
              -Recurse |
              Where-Object {
                $_.Name -like ".build_*"
              } |
              Sort-Object {
                $_.FullName.Length
              } -Descending
          )
          foreach ($dir in $oldDirs) {
            Write-Host "Removing: $($dir.FullName)"
            Remove-Item `
              -LiteralPath $dir.FullName `
              -Recurse `
              -Force
          }

      - name: Build Windows executables
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path `
            $env:GITHUB_WORKSPACE `
            "detailsSupportTool"
          $tempRoot = Join-Path `
            $env:RUNNER_TEMP `
            "details-support-windows"
          Remove-Item `
            -LiteralPath $tempRoot `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $tempRoot | Out-Null
          $builtCount = 0

          # Launcher template (.bat). __TOOL__ is replaced per tool.
          $batTemplate = @(
            '@echo off',
            'rem Auto-generated launcher for __TOOL__ (Windows)',
            'setlocal',
            'cd /d "%~dp0"',
            '',
            'rem Install requirements.txt if it exists next to this script.',
            'if exist "%~dp0requirements.txt" (',
            '  where python >nul 2>nul',
            '  if not errorlevel 1 (',
            '    echo Installing requirements...',
            '    python -m pip install -q -r "%~dp0requirements.txt"',
            '    if errorlevel 1 echo Warning: failed to install requirements',
            '  ) else (',
            '    echo Warning: Python not found; skipping requirements install',
            '  )',
            ')',
            '',
            'start "" "%~dp0__TOOL__.exe"',
            'endlocal'
          )

          Get-ChildItem -Path $root -Directory | ForEach-Object {
            $toolDir = $_.FullName
            $toolName = $_.Name
            $script = $null
            # Prefer main.py, then server.py.
            foreach ($name in @("main.py", "server.py")) {
              $candidate = Join-Path $toolDir $name
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $script = Get-Item -LiteralPath $candidate
                break
              }
            }
            # Fall back to another Python file in the tool folder.
            if (-not $script) {
              $script = Get-ChildItem `
                -Path $toolDir `
                -File `
                -Filter "*.py" |
                Where-Object {
                  $_.Name -ne "__init__.py"
                } |
                Sort-Object Name |
                Select-Object -First 1
            }
            if (-not $script) {
              Write-Host "Skipping ${toolName}: no Python entry point found"
              return
            }
            $toolTemp = Join-Path $tempRoot $toolName
            $distDir = Join-Path $toolTemp "dist"
            $workDir = Join-Path $toolTemp "work"
            $specDir = Join-Path $toolTemp "spec"
            New-Item `
              -ItemType Directory `
              -Force `
              -Path $distDir, $workDir, $specDir | Out-Null
            Write-Host "========================================"
            Write-Host "Building Windows executable: $toolName"
            Write-Host "Entry point: $($script.FullName)"
            Write-Host "========================================"
            python -m PyInstaller `
              --noconfirm `
              --clean `
              --name $toolName `
              --distpath $distDir `
              --workpath $workDir `
              --specpath $specDir `
              --onefile `
              --windowed `
              $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "PyInstaller failed for $toolName"
            }
            $generatedExe = Join-Path $distDir "$toolName.exe"
            $targetExe = Join-Path $toolDir "$toolName.exe"
            if (-not (Test-Path -LiteralPath $generatedExe -PathType Leaf)) {
              throw "Executable was not generated: $generatedExe"
            }
            Copy-Item `
              -LiteralPath $generatedExe `
              -Destination $targetExe `
              -Force
            Write-Host "Created: $targetExe"

            # Generate the launcher batch file (CRLF line endings).
            $batPath = Join-Path $toolDir "run_$toolName.bat"
            $batBody = ($batTemplate -join "`r`n") -replace '__TOOL__', $toolName
            [System.IO.File]::WriteAllText(
              $batPath,
              $batBody + "`r`n",
              (New-Object System.Text.UTF8Encoding($false))
            )
            Write-Host "Created: $batPath"

            $builtCount++
          }
          if ($builtCount -eq 0) {
            throw "No Windows executables were built."
          }
          Write-Host "Successfully built $builtCount Windows executables."

      - name: Commit and push Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- detailsSupportTool
          if git diff --cached --quiet; then
            echo "No Windows changes to commit"
          else
            git diff --cached --stat
            git commit -m "Build Windows DetailsSupport executables and launchers"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
