name: Build DetailsSupport tools into tool folders

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS app bundles
        required: false
        type: boolean
        default: true
      build_windows:
        description: Build Windows executables
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller

          while IFS= read -r req; do
            [ -n "$req" ] || continue
            echo "Installing: $req"
            python -m pip install -r "$req"
          done < <(find detailsSupportTool -type f -name "requirements.txt" -print | sort)

      - name: Build macOS apps into each tool folder
        shell: bash
        run: |
          set -euxo pipefail

          for tool_dir in detailsSupportTool/*; do
            [ -d "$tool_dir" ] || continue

            py_script=""
            for candidate in "$tool_dir"/*.py; do
              [ -f "$candidate" ] || continue
              case "$(basename "$candidate")" in
                "__init__.py") continue ;;
              esac
              py_script="$candidate"
              break
            done

            [ -n "$py_script" ] || continue

            base_name="$(basename "$tool_dir")"
            app_name="$base_name"

            # 既存の .app があれば削除してから上書き
            existing_app="$(find "$tool_dir" -maxdepth 1 -name "*.app" -print -quit || true)"
            if [ -n "$existing_app" ]; then
              rm -rf "$existing_app"
            fi

            echo "Building macOS app for: $tool_dir"
            pyinstaller \
              --noconfirm \
              --clean \
              --name "$app_name" \
              --distpath "$tool_dir" \
              --workpath "$tool_dir/.build_macos" \
              --specpath "$tool_dir/.build_macos" \
              --onedir \
              --windowed \
              "$py_script"

            # 生成された .app を tool directory に配置
            built_app="$tool_dir/$app_name.app"
            if [ -d "$built_app" ]; then
              rm -rf "$built_app"
              mv "$tool_dir/$app_name.app" "$tool_dir/$app_name.app"
            fi
          done

          find detailsSupportTool -maxdepth 2 -print | sort

      - name: Commit macOS artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code -- detailsSupportTool; then
            echo "No macOS changes to commit."
            exit 0
          fi

          git add detailsSupportTool
          git commit -m "Build macOS DetailsSupport apps"
          git push origin HEAD:${{ github.ref_name }}

  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller

          Get-ChildItem -Path "detailsSupportTool" -Recurse -File -Filter "requirements.txt" | ForEach-Object {
            Write-Host "Installing: $($_.FullName)"
            python -m pip install -r $_.FullName
          }

      - name: Build Windows executables directly into each tool folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Get-ChildItem -Path "detailsSupportTool" -Directory | ForEach-Object {
            $toolDir = $_.FullName
            $toolName = $_.Name

            $script = Get-ChildItem -Path $toolDir -File -Filter "*.py" |
              Where-Object { $_.Name -ne "__init__.py" } |
              Select-Object -First 1

            if (-not $script) {
              return
            }

            $existingExe = Join-Path $toolDir "$toolName.exe"
            if (Test-Path $existingExe) {
              Remove-Item $existingExe -Force
            }

            $existingOtherExe = Get-ChildItem -Path $toolDir -File -Filter "*.exe" | Select-Object -First 1
            if ($existingOtherExe) {
              Remove-Item $existingOtherExe.FullName -Force
            }

            Write-Host "Building Windows exe for: $toolDir"
            pyinstaller `
              --noconfirm `
              --clean `
              --name $toolName `
              --distpath $toolDir `
              --workpath "$toolDir\.build_windows" `
              --specpath "$toolDir\.build_windows" `
              --onefile `
              --windowed `
              $script.FullName

            $generatedExe = Join-Path $toolDir "$toolName.exe"
            if (-not (Test-Path $generatedExe)) {
              $fallback = Get-ChildItem -Path $toolDir -File -Filter "*.exe" | Select-Object -First 1
              if ($fallback) {
                $fallback.Name
              }
            }
          }

      - name: Commit Windows artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code -- detailsSupportTool; then
            echo "No Windows changes to commit."
            exit 0
          fi

          git add detailsSupportTool
          git commit -m "Build Windows DetailsSupport executables"
          git push origin HEAD:${{ github.ref_name }}
