name: Build and Release

# リポジトリのルート（SupportChigadio）直下の .github/workflows/ に置く。
# 実行方法:
#   1) タグを push する: git tag v1.0.0 && git push origin v1.0.0
#   2) Actions タブから "Run workflow"（タグ名を入力）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例: v1.0.0)"
        required: true
      build_frontend:
        description: "Reactをビルドして同梱する（通常はOFF。OFFならコミット済みのbuild/があればそれを使う）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_DIR: main-support
  APP_NAME: SupportChigadio
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            exe: SupportChigadio.exe

          # Apple Silicon 優先枠
          - os: macos-latest
            suffix: macos-arm64
            exe: SupportChigadio

          # Apple Silicon 予備枠（latest が容量不足で取れなかったとき用）
          - os: macos-15
            suffix: macos-arm64-fallback
            exe: SupportChigadio

          # Intel Mac
          - os: macos-15-intel
            suffix: macos-x64
            exe: SupportChigadio
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask werkzeug psutil websockets openpyxl
          if [ -f "$APP_DIR/requirements.txt" ]; then pip install -r "$APP_DIR/requirements.txt"; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---- フロントエンド(React) ----
      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_frontend }}
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_frontend }}
        run: |
          FE=""
          for d in "$APP_DIR" "."; do
            if [ -f "$d/package.json" ]; then FE="$d"; break; fi
          done
          if [ -z "$FE" ]; then
            echo "::error::package.json が見つかりません"
            exit 1
          fi
          (cd "$FE" && (npm ci || npm install) && npm run build)
          echo "FRONTEND_BUILD=$FE/build" >> "$GITHUB_ENV"

      - name: Use committed build folder (if any)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_frontend) }}
        run: |
          if [ -d "$APP_DIR/build" ]; then
            echo "FRONTEND_BUILD=$APP_DIR/build" >> "$GITHUB_ENV"
          else
            echo "::notice::build/ が無いため、画面なしでパッケージします"
          fi

      # ---- PyInstaller ----
      - name: Build executable
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -f pythonSrc/__init__.py ]; then touch pythonSrc/__init__.py; fi

          pyinstaller --noconfirm --clean --onefile \
            --name "$APP_NAME" \
            --paths . \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            app.py

          ls -la dist

      # ---- ステージング ----
      - name: Stage binary
        run: |
          STAGE="staging/${{ matrix.suffix }}/main-support"
          mkdir -p "$STAGE"
          cp "$APP_DIR/dist/${{ matrix.exe }}" "$STAGE/"

          if [ -n "$FRONTEND_BUILD" ] && [ -d "$FRONTEND_BUILD" ]; then
            cp -r "$FRONTEND_BUILD" "$STAGE/build"
          fi

          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "$STAGE/${{ matrix.exe }}"
            codesign --force --sign - "$STAGE/${{ matrix.exe }}" || true
          fi

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.suffix }}
          path: staging/${{ matrix.suffix }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      # ========== Windows ==========
      - name: Package Windows
        run: |
          if [ ! -d artifacts/staging-windows-x64 ]; then
            echo "::warning::Windows build が無いためスキップ"
            exit 0
          fi

          ROOT="package/SupportChigadio"
          mkdir -p "$ROOT"
          cp -r artifacts/staging-windows-x64/main-support "$ROOT/"

          cat > "$ROOT/SupportChigadio.bat" << 'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"

          if exist "SupportChigadio.exe" (
            start "" "SupportChigadio.exe"
            exit /b 0
          )

          if not exist "main-support\SupportChigadio.exe" (
            echo Error: main-support\SupportChigadio.exe が見つかりません
            pause
            exit /b 1
          )

          echo 初回セットアップ中...
          xcopy /E /I /Y "main-support\*" "." >nul
          if errorlevel 1 (
            echo コピーに失敗しました
            pause
            exit /b 1
          )

          start "" "SupportChigadio.exe"
          EOF

          cd package
          7z a -tzip "../SupportChigadio-windows-x64.zip" "SupportChigadio"

      # ========== macOS（arm64 優先 + fallback / x64） ==========
      - name: Package macOS (universal)
        run: |
          # arm64: macos-latest を優先、無ければ macos-15 の fallback を使う
          ARM_SRC=""
          if [ -d artifacts/staging-macos-arm64 ]; then
            ARM_SRC="artifacts/staging-macos-arm64"
            echo "arm64: macos-latest の成果物を使用"
          elif [ -d artifacts/staging-macos-arm64-fallback ]; then
            ARM_SRC="artifacts/staging-macos-arm64-fallback"
            echo "arm64: macos-15 fallback の成果物を使用"
          fi

          X64_SRC=""
          if [ -d artifacts/staging-macos-x64 ]; then
            X64_SRC="artifacts/staging-macos-x64"
            echo "x64: 成果物を使用"
          fi

          if [ -z "$ARM_SRC" ] && [ -z "$X64_SRC" ]; then
            echo "::warning::macOS build が無いためスキップ"
            exit 0
          fi

          ROOT="package/SupportChigadio"
          mkdir -p "$ROOT"

          if [ -n "$ARM_SRC" ]; then
            mkdir -p "$ROOT/arm64"
            cp -r "$ARM_SRC/main-support" "$ROOT/arm64/"
          fi
          if [ -n "$X64_SRC" ]; then
            mkdir -p "$ROOT/x64"
            cp -r "$X64_SRC/main-support" "$ROOT/x64/"
          fi

          cat > "$ROOT/SupportChigadio.command" << 'EOF'
          #!/bin/bash
          set -e
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          cd "$ROOT"

          # 隔離属性を解除
          xattr -cr "$ROOT" 2>/dev/null || true

          # 2回目以降
          if [ -x "./SupportChigadio" ]; then
            if ! codesign --verify "./SupportChigadio" 2>/dev/null; then
              codesign --force --sign - "./SupportChigadio" 2>/dev/null || true
            fi
            exec "./SupportChigadio"
          fi

          # 初回: アーキテクチャ判定してコピー
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            SRC="arm64/main-support"
          else
            SRC="x64/main-support"
          fi

          if [ ! -d "$SRC" ]; then
            echo "エラー: 対応する実行ファイルが見つかりません ($SRC)"
            echo "このパッケージは別アーキテクチャ用のみの可能性があります"
            read -r -p "Enterキーで終了..."
            exit 1
          fi

          echo "初回セットアップ中... ($ARCH)"
          cp -R "$SRC"/* .
          chmod +x ./SupportChigadio
          codesign --force --sign - ./SupportChigadio 2>/dev/null || true

          exec ./SupportChigadio
          EOF
          chmod +x "$ROOT/SupportChigadio.command"

          cp "$ROOT/SupportChigadio.command" "$ROOT/SupportChigadio.sh"
          chmod +x "$ROOT/SupportChigadio.sh"

          cd package
          zip -r -y "../SupportChigadio-macos.zip" "SupportChigadio"

      - name: List final zips
        run: ls -la *.zip || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            SupportChigadio-windows-x64.zip
            SupportChigadio-macos.zip
          body: |
            ## ダウンロード
            - **Windows (x64)**: `SupportChigadio-windows-x64.zip`
            - **macOS (Apple Silicon / Intel 両対応)**: `SupportChigadio-macos.zip`

            ## 使い方
            1. zip を解凍する
            2. 出てきた **SupportChigadio** フォルダを開く
            3. その中にある起動ファイルを実行する
               - **Windows**: `SupportChigadio.bat` をダブルクリック
               - **macOS**: `SupportChigadio.command` をダブルクリック
                 （自動で arm64 / Intel を判定し、初回のみ必要なファイルを直下にコピーして起動します）
            4. 起動時のダイアログで「サーバーモード / 通常モード」を選択
            5. データは `SupportChigadio` フォルダの**親**に `data/` として作成されます

            ### macOS の初回起動について
            ブラウザから落とした zip は隔離属性が付いているため、初回だけ次のどちらかを行ってください。
            - `SupportChigadio.command` を右クリック →「開く」
            - ターミナルで `xattr -cr SupportChigadio`

            ランチャー側でも `xattr -cr` と ad-hoc 署名を自動で行うため、2回目以降は通常どおりダブルクリックで起動できます。
