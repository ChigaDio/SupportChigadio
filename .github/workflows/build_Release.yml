name: Build and Release　Commnad Sh Bat

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例: v1.0.0)"
        required: true
      build_frontend:
        description: "Reactをビルドして同梱する（通常はOFF。OFFならコミット済みのbuild/があればそれを使う）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_DIR: main-support
  APP_NAME: SupportChigadio
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            exe: SupportChigadio.exe
          - os: macos-latest
            suffix: macos-arm64
            exe: SupportChigadio
          - os: macos-15
            suffix: macos-arm64-fallback
            exe: SupportChigadio
          - os: macos-15-intel
            suffix: macos-x64
            exe: SupportChigadio
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask werkzeug psutil websockets openpyxl
          if [ -f "$APP_DIR/requirements.txt" ]; then pip install -r "$APP_DIR/requirements.txt"; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_frontend }}
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_frontend }}
        run: |
          FE=""
          for d in "$APP_DIR" "."; do
            if [ -f "$d/package.json" ]; then FE="$d"; break; fi
          done
          if [ -z "$FE" ]; then
            echo "::error::package.json が見つかりません"
            exit 1
          fi
          (cd "$FE" && (npm ci || npm install) && npm run build)
          echo "FRONTEND_BUILD=$FE/build" >> "$GITHUB_ENV"

      - name: Use committed build folder (if any)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_frontend) }}
        run: |
          if [ -d "$APP_DIR/build" ]; then
            echo "FRONTEND_BUILD=$APP_DIR/build" >> "$GITHUB_ENV"
          else
            echo "::notice::build/ が無いため、画面なしでパッケージします"
          fi

      - name: Build executable
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -f pythonSrc/__init__.py ]; then touch pythonSrc/__init__.py; fi
          pyinstaller --noconfirm --clean --onefile \
            --name "$APP_NAME" \
            --paths . \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            app.py
          ls -la dist

      - name: Stage binary
        run: |
          STAGE="staging/${{ matrix.suffix }}/main-support"
          mkdir -p "$STAGE"
          cp "$APP_DIR/dist/${{ matrix.exe }}" "$STAGE/"
          if [ -n "$FRONTEND_BUILD" ] && [ -d "$FRONTEND_BUILD" ]; then
            cp -r "$FRONTEND_BUILD" "$STAGE/build"
          fi
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "$STAGE/${{ matrix.exe }}"
            codesign --force --sign - "$STAGE/${{ matrix.exe }}" || true
          fi

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.suffix }}
          path: staging/${{ matrix.suffix }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package Windows
        run: |
          if [ ! -d artifacts/staging-windows-x64 ]; then
            echo "::warning::Windows build が無いためスキップ"
            exit 0
          fi
          ROOT="package/SupportChigadio"
          mkdir -p "$ROOT"
          cp -r artifacts/staging-windows-x64/main-support "$ROOT/"
          cat > "$ROOT/SupportChigadio.bat" << 'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          if exist "SupportChigadio.exe" (
            start "" "SupportChigadio.exe"
            exit /b 0
          )
          if not exist "main-support\SupportChigadio.exe" (
            echo Error: main-support\SupportChigadio.exe が見つかりません
            pause
            exit /b 1
          )
          echo 初回セットアップ中...
          xcopy /E /I /Y "main-support\*" "." >nul
          start "" "SupportChigadio.exe"
          EOF
          cd package
          7z a -tzip "../SupportChigadio-windows-x64.zip" "SupportChigadio"

      - name: Package macOS
        run: |
          ARM_SRC=""
          if [ -d artifacts/staging-macos-arm64 ]; then
            ARM_SRC="artifacts/staging-macos-arm64"
          elif [ -d artifacts/staging-macos-arm64-fallback ]; then
            ARM_SRC="artifacts/staging-macos-arm64-fallback"
          fi
          X64_SRC=""
          [ -d artifacts/staging-macos-x64 ] && X64_SRC="artifacts/staging-macos-x64"
          if [ -z "$ARM_SRC" ] && [ -z "$X64_SRC" ]; then
            echo "::warning::macOS build が無いためスキップ"
            exit 0
          fi
          ROOT="package/SupportChigadio"
          mkdir -p "$ROOT"
          if [ -n "$ARM_SRC" ]; then
            mkdir -p "$ROOT/arm64"
            cp -r "$ARM_SRC/main-support" "$ROOT/arm64/"
          fi
          if [ -n "$X64_SRC" ]; then
            mkdir -p "$ROOT/x64"
            cp -r "$X64_SRC/main-support" "$ROOT/x64/"
          fi
          cat > "$ROOT/SupportChigadio.command" << 'EOF'
          #!/bin/bash
          set -e
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          cd "$ROOT"
          xattr -cr "$ROOT" 2>/dev/null || true
          if [ -x "./SupportChigadio" ]; then
            if ! codesign --verify "./SupportChigadio" 2>/dev/null; then
              codesign --force --sign - "./SupportChigadio" 2>/dev/null || true
            fi
            exec "./SupportChigadio"
          fi
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then SRC="arm64/main-support"; else SRC="x64/main-support"; fi
          if [ ! -d "$SRC" ]; then
            echo "エラー: 対応する実行ファイルが見つかりません ($SRC)"
            read -r -p "Enterキーで終了..."
            exit 1
          fi
          echo "初回セットアップ中... ($ARCH)"
          cp -R "$SRC"/* .
          chmod +x ./SupportChigadio
          codesign --force --sign - ./SupportChigadio 2>/dev/null || true
          exec ./SupportChigadio
          EOF
          chmod +x "$ROOT/SupportChigadio.command"
          cp "$ROOT/SupportChigadio.command" "$ROOT/SupportChigadio.sh"
          chmod +x "$ROOT/SupportChigadio.sh"
          cd package
          zip -r -y "../SupportChigadio-macos.zip" "SupportChigadio"

      - name: List final zips
        run: ls -la *.zip || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            SupportChigadio-windows-x64.zip
            SupportChigadio-macos.zip
          body: |
            ## ダウンロード
            - **Windows (x64)**: `SupportChigadio-windows-x64.zip`
            - **macOS (Apple Silicon / Intel 両対応)**: `SupportChigadio-macos.zip`

            ## 使い方
            1. zip を解凍する
            2. 出てきた **SupportChigadio** フォルダを開く
            3. その中の起動ファイルを実行
               - Windows: `SupportChigadio.bat`
               - macOS: `SupportChigadio.command`
            4. データは `SupportChigadio` の親に `data/` が作られます

            ### macOS 初回
            - `SupportChigadio.command` を右クリック →「開く」
            - または `xattr -cr SupportChigadio`

  commit-to-repo:
    name: Commit & Push to repository
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: commit-to-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package zips
        run: |
          # Windows
          if [ -d artifacts/staging-windows-x64 ]; then
            ROOT="pkg-win/SupportChigadio"
            mkdir -p "$ROOT"
            cp -r artifacts/staging-windows-x64/main-support "$ROOT/"
            cat > "$ROOT/SupportChigadio.bat" << 'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          if exist "SupportChigadio.exe" (
            start "" "SupportChigadio.exe"
            exit /b 0
          )
          if not exist "main-support\SupportChigadio.exe" (
            echo Error: main-support\SupportChigadio.exe が見つかりません
            pause
            exit /b 1
          )
          echo 初回セットアップ中...
          xcopy /E /I /Y "main-support\*" "." >nul
          start "" "SupportChigadio.exe"
          EOF
            (cd pkg-win && 7z a -tzip "../SupportChigadio-windows-x64.zip" "SupportChigadio")
          fi

          # macOS
          ARM_SRC=""
          if [ -d artifacts/staging-macos-arm64 ]; then
            ARM_SRC="artifacts/staging-macos-arm64"
          elif [ -d artifacts/staging-macos-arm64-fallback ]; then
            ARM_SRC="artifacts/staging-macos-arm64-fallback"
          fi
          X64_SRC=""
          [ -d artifacts/staging-macos-x64 ] && X64_SRC="artifacts/staging-macos-x64"
          if [ -n "$ARM_SRC" ] || [ -n "$X64_SRC" ]; then
            ROOT="pkg-mac/SupportChigadio"
            mkdir -p "$ROOT"
            if [ -n "$ARM_SRC" ]; then
              mkdir -p "$ROOT/arm64"
              cp -r "$ARM_SRC/main-support" "$ROOT/arm64/"
            fi
            if [ -n "$X64_SRC" ]; then
              mkdir -p "$ROOT/x64"
              cp -r "$X64_SRC/main-support" "$ROOT/x64/"
            fi
            cat > "$ROOT/SupportChigadio.command" << 'EOF'
          #!/bin/bash
          set -e
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          cd "$ROOT"
          xattr -cr "$ROOT" 2>/dev/null || true
          if [ -x "./SupportChigadio" ]; then
            if ! codesign --verify "./SupportChigadio" 2>/dev/null; then
              codesign --force --sign - "./SupportChigadio" 2>/dev/null || true
            fi
            exec "./SupportChigadio"
          fi
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then SRC="arm64/main-support"; else SRC="x64/main-support"; fi
          if [ ! -d "$SRC" ]; then
            echo "エラー: 対応する実行ファイルが見つかりません ($SRC)"
            read -r -p "Enterキーで終了..."
            exit 1
          fi
          echo "初回セットアップ中... ($ARCH)"
          cp -R "$SRC"/* .
          chmod +x ./SupportChigadio
          codesign --force --sign - ./SupportChigadio 2>/dev/null || true
          exec ./SupportChigadio
          EOF
            chmod +x "$ROOT/SupportChigadio.command"
            cp "$ROOT/SupportChigadio.command" "$ROOT/SupportChigadio.sh"
            chmod +x "$ROOT/SupportChigadio.sh"
            (cd pkg-mac && zip -r -y "../SupportChigadio-macos.zip" "SupportChigadio")
          fi
          ls -la *.zip || true

      - name: Create root launchers
        run: |
          # ---- リポジトリ直下用 run_SupportChigadio.bat ----
          cat > run_SupportChigadio.bat << 'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"

          set "ZIP=SupportChigadio-windows-x64.zip"
          set "DIR=SupportChigadio"

          set "NEED_EXTRACT=0"
          if not exist "%DIR%" set "NEED_EXTRACT=1"
          if exist "VERSION" if exist "%DIR%\.version" (
            fc /b VERSION "%DIR%\.version" >nul 2>&1
            if errorlevel 1 set "NEED_EXTRACT=1"
          )

          if "%NEED_EXTRACT%"=="1" (
            if not exist "%ZIP%" (
              echo Error: %ZIP% が見つかりません
              pause
              exit /b 1
            )
            echo 解凍中... (%ZIP%)
            if exist "%DIR%" rmdir /s /q "%DIR%"
            powershell -NoProfile -Command "Expand-Archive -Path '%ZIP%' -DestinationPath '.' -Force"
            if exist VERSION copy /y VERSION "%DIR%\.version" >nul
          )

          if exist "%DIR%\SupportChigadio.bat" (
            call "%DIR%\SupportChigadio.bat"
            exit /b %errorlevel%
          )
          echo Error: %DIR%\SupportChigadio.bat が見つかりません
          pause
          exit /b 1
          EOF

          # ---- リポジトリ直下用 run_SupportChigadio.command / .sh ----
          cat > run_SupportChigadio.command << 'EOF'
          #!/bin/bash
          set -e
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          cd "$ROOT"

          ZIP="SupportChigadio-macos.zip"
          DIR="SupportChigadio"

          NEED_EXTRACT=0
          if [ ! -d "$DIR" ]; then
            NEED_EXTRACT=1
          elif [ -f VERSION ] && [ -f "$DIR/.version" ]; then
            if [ "$(cat VERSION)" != "$(cat "$DIR/.version")" ]; then
              NEED_EXTRACT=1
            fi
          fi

          if [ "$NEED_EXTRACT" = "1" ]; then
            if [ ! -f "$ZIP" ]; then
              echo "Error: $ZIP が見つかりません"
              read -r -p "Enterキーで終了..."
              exit 1
            fi
            echo "解凍中... ($ZIP)"
            rm -rf "$DIR"
            unzip -q -o "$ZIP"
            cp VERSION "$DIR/.version" 2>/dev/null || true
          fi

          if [ -x "$DIR/SupportChigadio.command" ]; then
            exec "$DIR/SupportChigadio.command"
          fi
          echo "Error: $DIR/SupportChigadio.command が見つかりません"
          read -r -p "Enterキーで終了..."
          exit 1
          EOF
          chmod +x run_SupportChigadio.command
          cp run_SupportChigadio.command run_SupportChigadio.sh
          chmod +x run_SupportChigadio.sh

      - name: Check file sizes
        run: |
          BIG=$(find . -maxdepth 1 -name '*.zip' -size +100M)
          if [ -n "$BIG" ]; then
            echo "::error::100MBを超えるファイルがあるため push できません:"
            echo "$BIG"
            exit 1
          fi

      - name: Commit and push
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "$TAG" > VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION
          [ -f SupportChigadio-windows-x64.zip ] && git add SupportChigadio-windows-x64.zip
          [ -f SupportChigadio-macos.zip ] && git add SupportChigadio-macos.zip
          git add run_SupportChigadio.bat run_SupportChigadio.command run_SupportChigadio.sh

          if git diff --staged --quiet; then
            echo "変更がありません。push をスキップします。"
            exit 0
          fi

          git commit -m "Release ${TAG}: update distribution zips, launchers and VERSION"
          git push origin HEAD:${{ github.event.repository.default_branch }}
