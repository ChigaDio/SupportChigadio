name: Build and Release

# リポジトリのルート（SupportChigadio）直下の .github/workflows/ に置く。
# 実行方法:
#   1) タグを push する:  git tag v1.0.0 && git push origin v1.0.0
#   2) Actions タブから "Run workflow"（タグ名を入力）
#
# ビルド成果物は
#   - GitHub Release に添付
#   - SupportChigadio リポジトリのルート直下にも commit & push
# の両方に反映される。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースタグ (例: v1.0.0)"
        required: true

permissions:
  contents: write # リリース作成 / リポジトリへの push に必要

env:
  APP_DIR: main-support # app.py があるフォルダ（リポジトリルートからの相対パス）
  APP_NAME: SupportChigadio
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            exe: SupportChigadio.exe
          - os: macos-latest # Apple Silicon (arm64)
            suffix: macos-arm64
            exe: SupportChigadio
          - os: macos-15-intel # Intel Mac (x64)
            suffix: macos-x64
            exe: SupportChigadio
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # app.py / pythonSrc が import している外部ライブラリ
          pip install pyinstaller flask werkzeug psutil websockets openpyxl
          # requirements.txt があれば追加で入れる
          if [ -f "$APP_DIR/requirements.txt" ]; then pip install -r "$APP_DIR/requirements.txt"; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---- フロントエンド(React)のビルド ----
      # 実行ファイルは「exeと同じ場所の build/」を静的ファイルとして配信するため、
      # package.json が見つかればビルドし、なければ既存の build/ を使う。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend (if present)
        run: |
          FE=""
          for d in "$APP_DIR" "."; do
            if [ -f "$d/package.json" ]; then FE="$d"; break; fi
          done

          FRONTEND_BUILD=""
          if [ -n "$FE" ]; then
            echo "Frontend found in: $FE"
            (cd "$FE" && (npm ci || npm install) && npm run build)
            FRONTEND_BUILD="$FE/build"
          elif [ -d "$APP_DIR/build" ]; then
            echo "package.json なし。コミット済みの $APP_DIR/build を使用します"
            FRONTEND_BUILD="$APP_DIR/build"
          else
            echo "::warning::フロントエンド(build/)が見つかりません。画面なしでパッケージされます"
          fi
          echo "FRONTEND_BUILD=$FRONTEND_BUILD" >> "$GITHUB_ENV"

      # ---- PyInstaller ----
      - name: Build executable
        working-directory: ${{ env.APP_DIR }}
        run: |
          # pythonSrc を確実にパッケージ扱いにする（無ければ空の __init__.py を作る）
          if [ ! -f pythonSrc/__init__.py ]; then touch pythonSrc/__init__.py; fi

          pyinstaller --noconfirm --clean --onefile \
            --name "$APP_NAME" \
            --paths . \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            app.py

          ls -la dist

      # ---- 配布用に整える ----
      # 配置: <zip>/main-support/{実行ファイル, build/}
      # 実行ファイルは ../data を DATA_DIR として使うため、
      # 解凍した main-support の隣に data/ が作られる。
      - name: Package
        run: |
          STAGE="package/${APP_NAME}-${{ matrix.suffix }}/main-support"
          mkdir -p "$STAGE"
          cp "$APP_DIR/dist/${{ matrix.exe }}" "$STAGE/"
          if [ -n "$FRONTEND_BUILD" ] && [ -d "$FRONTEND_BUILD" ]; then
            cp -r "$FRONTEND_BUILD" "$STAGE/build"
          fi
          if [ "$RUNNER_OS" != "Windows" ]; then chmod +x "$STAGE/${{ matrix.exe }}"; fi

      # ---- macOS 用ランチャー (.command / .sh) ----
      # main-support の「親フォルダ」（zip解凍後のトップ）に置く。
      #   .command : Finder でダブルクリックするとターミナルで実行される
      #   .sh      : 同じ内容（ターミナルから実行する用）
      # 起動時に隔離フラグ(quarantine)を解除するので、
      # 「開発元が未確認」「壊れている」ダイアログを出さずに起動できる。
      - name: Add macOS launchers
        if: runner.os == 'macOS'
        run: |
          PKG="package/${APP_NAME}-${{ matrix.suffix }}"
          STAGE="$PKG/main-support"

          # ビルド時に ad-hoc 署名（Apple Silicon で必須）
          codesign --force --sign - "$STAGE/${{ matrix.exe }}"
          codesign --verify --verbose=2 "$STAGE/${{ matrix.exe }}"

          LAUNCHER_SH="$PKG/run_${APP_NAME}.sh"
          LAUNCHER_CMD="$PKG/run_${APP_NAME}.command"
          cat > "$LAUNCHER_SH" <<'LAUNCHER_EOF'
          #!/bin/bash
          # Auto-generated launcher for __APP__ (macOS)
          # Lives next to the main-support folder.
          # 1) clears the quarantine flag so macOS does not ask for approval
          # 2) makes sure the binary is executable and signed
          # 3) runs it from main-support (data/ is created next to main-support)
          DIR="$(cd "$(dirname "$0")" && pwd)"
          APP_DIR="$DIR/main-support"
          EXE="$APP_DIR/__APP__"

          if [ ! -f "$EXE" ]; then
            echo "Error: $EXE not found."
            read -r -p "Press Enter to close..."
            exit 1
          fi

          # Remove quarantine / extended attributes from the whole package.
          xattr -cr "$DIR" 2>/dev/null || true
          chmod +x "$EXE" 2>/dev/null || true

          # Re-sign ad hoc only if the signature is missing or broken.
          if ! codesign --verify "$EXE" 2>/dev/null; then
            codesign --force --sign - "$EXE" 2>/dev/null || true
          fi

          cd "$APP_DIR" || exit 1

          # Run in this terminal so logs stay visible; Ctrl+C or closing the
          # terminal stops the server.
          "$EXE"
          code=$?
          echo
          echo "Exited with code $code."
          read -r -p "Press Enter to close..."
          LAUNCHER_EOF
          sed -i '' -e "s/__APP__/${APP_NAME}/g" "$LAUNCHER_SH"
          cp "$LAUNCHER_SH" "$LAUNCHER_CMD"
          chmod +x "$LAUNCHER_SH" "$LAUNCHER_CMD"
          echo "Created: $LAUNCHER_SH"
          echo "Created: $LAUNCHER_CMD"
          ls -la "$PKG"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: |
          cd package
          7z a -tzip "../${APP_NAME}-${{ matrix.suffix }}.zip" "${APP_NAME}-${{ matrix.suffix }}"

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd package
          # -y でシンボリックリンクを保持、実行権限もzipに保存される
          zip -r -y "../${APP_NAME}-${{ matrix.suffix }}.zip" "${APP_NAME}-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.suffix }}
          path: ${{ env.APP_NAME }}-${{ matrix.suffix }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: ${{ !cancelled() }} # buildが一部失敗しても、成功した分だけでリリースする
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.zip
          body: |
            ## ダウンロード
            - **Windows (x64)**: `SupportChigadio-windows-x64.zip`
            - **macOS (Apple Silicon)**: `SupportChigadio-macos-arm64.zip`
            - **macOS (Intel)**: `SupportChigadio-macos-x64.zip`

            ## 使い方
            ### Windows
            1. zipを解凍し、`main-support` フォルダ内の `SupportChigadio.exe` を起動
            2. 起動時のダイアログで「サーバーモード / 通常モード」を選択
            3. データは `main-support` の隣の `data/` に作成されます

            ### macOS
            1. zipを解凍し、`main-support` と同じ階層にある `run_SupportChigadio.command` をダブルクリック
               （`.sh` でもOKですが、ダブルクリックで動くのは `.command` です）
            2. 起動時のダイアログで「サーバーモード / 通常モード」を選択
            3. データは `main-support` の隣の `data/` に作成されます

            ランチャーが起動時に隔離フラグの解除と署名の確認を自動で行うため、
            「開発元が未確認」の許可操作は基本的に不要です。

            #### 初回だけ必要な操作
            ブラウザでダウンロードしたzipは、ランチャー自体も macOS にブロックされます。
            次のどちらかを一度だけ実行してください。
            - `run_SupportChigadio.command` を右クリック →「開く」
            - ターミナルで `xattr -cr SupportChigadio-macos-*`

            `.command` が実行できない場合は `chmod +x run_SupportChigadio.command` を実行してください。

  # ---- SupportChigadio リポジトリ本体にも commit & push ----
  # release ジョブとは独立して並列に動く（どちらかが失敗してももう一方は実行される）。
  # タグ push で起動した場合 checkout は detached HEAD になるため、
  # デフォルトブランチを明示的に checkout して、そこへ push する。
  # GITHUB_TOKEN による push は他のワークフローを起動しないので、無限ループにはならない。
  commit-to-repo:
    name: Commit & Push to repository
    needs: build
    if: ${{ !cancelled() }} # buildが一部失敗しても、成功した分だけ commit する
    runs-on: ubuntu-latest
    concurrency:
      group: commit-to-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check file sizes
        run: |
          ls -la artifacts
          # GitHub は 100MB を超えるファイルの push を拒否する
          BIG=$(find artifacts -name '*.zip' -size +100M)
          if [ -n "$BIG" ]; then
            echo "::error::100MBを超えるファイルがあるため push できません（Git LFS の利用を検討してください）:"
            echo "$BIG"
            exit 1
          fi

      - name: Commit and push
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          # リポジトリのルート直下に置く（同名のzipを上書き。ビルドに失敗したOSの分は前回のzipが残る）
          cp artifacts/*.zip ./
          echo "$TAG" > VERSION

          # ---- 解凍して起動するランチャー（ルート直下に置く）----
          #   Windows : run_<APP>.bat
          #   macOS   : run_<APP>.command（ダブルクリック） / run_<APP>.sh（ターミナル用・同じ内容）
          # 初回、または VERSION が変わったときだけ zip を解凍し、そのまま起動する。
          # 解凍先は zip と同じ場所（<APP>-<suffix>/main-support/）。data/ は上書きされず残る。
          BAT="run_${APP_NAME}.bat"
          SH="run_${APP_NAME}.sh"
          CMD="run_${APP_NAME}.command"

          cat > "$BAT" <<'BAT_EOF'
          @echo off
          setlocal
          rem Auto-generated launcher for __APP__ (Windows)
          rem Extracts the zip next to this file (first run / when VERSION changes), then starts the app.
          cd /d "%~dp0"

          set "PKG=__APP__-windows-x64"
          set "ZIP=%PKG%.zip"
          set "EXE=%~dp0%PKG%\main-support\__APP__.exe"

          if not exist "%ZIP%" (
            echo Error: %ZIP% not found.
            pause
            exit /b 1
          )

          set "NEWVER=unknown"
          if exist "VERSION" set /p NEWVER=<"VERSION"
          set "OLDVER="
          if exist "%PKG%\.version" set /p OLDVER=<"%PKG%\.version"

          if not exist "%EXE%" goto extract
          if not "%NEWVER%"=="%OLDVER%" goto extract
          goto run

          :extract
          echo Extracting %ZIP% ...
          tar -xf "%ZIP%" >nul 2>&1
          if errorlevel 1 powershell -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '%ZIP%' -DestinationPath '.' -Force"
          if errorlevel 1 (
            echo Extract failed.
            pause
            exit /b 1
          )
          > "%PKG%\.version" echo %NEWVER%

          :run
          cd /d "%~dp0%PKG%\main-support"
          "%EXE%"
          echo.
          echo Exited with code %errorlevel%.
          pause
          endlocal
          BAT_EOF
          sed -i "s/__APP__/${APP_NAME}/g" "$BAT"
          sed -i 's/$/\r/' "$BAT"   # .bat は CRLF にする

          cat > "$SH" <<'SH_EOF'
          #!/bin/bash
          # Auto-generated launcher for __APP__ (macOS)
          # Extracts the zip that matches this Mac (first run / when VERSION changes),
          # then runs the packaged launcher (which clears quarantine and signs the binary).
          DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$DIR" || exit 1

          # Apple Silicon (also when Terminal runs under Rosetta) -> arm64 build, otherwise Intel build
          if [ "$(uname -m)" = "arm64" ] || [ "$(sysctl -n hw.optional.arm64 2>/dev/null)" = "1" ]; then
            SUFFIX="macos-arm64"
          else
            SUFFIX="macos-x64"
          fi

          PKG="__APP__-$SUFFIX"
          ZIP="$DIR/$PKG.zip"
          INNER="$DIR/$PKG/run___APP__.sh"

          if [ ! -f "$ZIP" ]; then
            echo "Error: $ZIP not found."
            read -r -p "Press Enter to close..."
            exit 1
          fi

          NEWVER="unknown"
          [ -f "$DIR/VERSION" ] && NEWVER="$(head -n 1 "$DIR/VERSION")"
          OLDVER=""
          [ -f "$DIR/$PKG/.version" ] && OLDVER="$(head -n 1 "$DIR/$PKG/.version")"

          if [ ! -f "$INNER" ] || [ "$NEWVER" != "$OLDVER" ]; then
            echo "Extracting $PKG.zip ..."
            xattr -c "$ZIP" 2>/dev/null || true
            if ! ditto -x -k "$ZIP" "$DIR"; then
              echo "Extract failed."
              read -r -p "Press Enter to close..."
              exit 1
            fi
            echo "$NEWVER" > "$DIR/$PKG/.version"
          fi

          chmod +x "$INNER" 2>/dev/null || true
          exec bash "$INNER"
          SH_EOF
          sed -i "s/__APP__/${APP_NAME}/g" "$SH"
          cp "$SH" "$CMD"
          chmod +x "$SH" "$CMD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # zip・VERSION・ランチャーだけを追加する（他のファイルは触らない）
          git add -- ./*.zip VERSION "$BAT" "$SH" "$CMD"

          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします"
            exit 0
          fi

          git commit -m "Release $TAG: update build artifacts"

          # 他のコミットと競合しないよう、取り込んでから push（数回リトライ）
          BRANCH="${{ github.event.repository.default_branch }}"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "push に失敗しました。リトライ ($i/3)"
            sleep 5
          done
          exit 1
