name: Build Main Support App

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller flask werkzeug psutil websockets openpyxl
          if [ -f main-support/requirements.txt ]; then pip install -r main-support/requirements.txt; fi
          if [ -f main-support/pythonSrc/requirements.txt ]; then pip install -r main-support/pythonSrc/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build executable
        working-directory: main-support
        shell: pwsh
        run: |
          if (!(Test-Path "pythonSrc/__init__.py")) { New-Item -ItemType File -Path "pythonSrc/__init__.py" | Out-Null }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MainSupport --paths . --hidden-import tkinter --hidden-import tkinter.filedialog app.py
          if (!(Test-Path "dist/MainSupport.exe")) {
            throw "MainSupport.exe was not generated."
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: main-support-windows
          path: main-support/dist/MainSupport.exe
          if-no-files-found: error
          compression-level: 0

  build-macos-arm-primary:
    name: Build macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify ARM64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" || {
            echo "::error::Primary runner is not ARM64: $(uname -m)"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller flask werkzeug psutil websockets openpyxl
          if [ -f main-support/requirements.txt ]; then pip install -r main-support/requirements.txt; fi
          if [ -f main-support/pythonSrc/requirements.txt ]; then pip install -r main-support/pythonSrc/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build macOS executable
        working-directory: main-support
        run: |
          if [ ! -f pythonSrc/__init__.py ]; then touch pythonSrc/__init__.py; fi
          python -m PyInstaller --noconfirm --clean --onefile --name MainSupport --paths . --hidden-import tkinter --hidden-import tkinter.filedialog app.py
          test -f "dist/MainSupport"
          chmod +x "dist/MainSupport"
          codesign --force --sign - "dist/MainSupport"
          codesign --verify --strict "dist/MainSupport"

      - name: Upload ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: main-support-macos-arm64
          path: main-support/dist/MainSupport
          if-no-files-found: error
          compression-level: 0

  build-macos-arm-fallback:
    name: Build macOS ARM64 fallback
    needs: build-macos-arm-primary
    if: needs.build-macos-arm-primary.result == 'failure'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify ARM64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" || {
            echo "::error::Fallback runner is not ARM64: $(uname -m)"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller flask werkzeug psutil websockets openpyxl
          if [ -f main-support/requirements.txt ]; then pip install -r main-support/requirements.txt; fi
          if [ -f main-support/pythonSrc/requirements.txt ]; then pip install -r main-support/pythonSrc/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build macOS executable
        working-directory: main-support
        run: |
          if [ ! -f pythonSrc/__init__.py ]; then touch pythonSrc/__init__.py; fi
          python -m PyInstaller --noconfirm --clean --onefile --name MainSupport --paths . --hidden-import tkinter --hidden-import tkinter.filedialog app.py
          test -f "dist/MainSupport"
          chmod +x "dist/MainSupport"
          codesign --force --sign - "dist/MainSupport"
          codesign --verify --strict "dist/MainSupport"

      - name: Upload ARM64 fallback executable
        uses: actions/upload-artifact@v4
        with:
          name: main-support-macos-arm64
          path: main-support/dist/MainSupport
          if-no-files-found: error
          compression-level: 0

  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify x64 runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64" || {
            echo "::error::Runner is not x86_64: $(uname -m)"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller flask werkzeug psutil websockets openpyxl
          if [ -f main-support/requirements.txt ]; then pip install -r main-support/requirements.txt; fi
          if [ -f main-support/pythonSrc/requirements.txt ]; then pip install -r main-support/pythonSrc/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build macOS executable
        working-directory: main-support
        run: |
          if [ ! -f pythonSrc/__init__.py ]; then touch pythonSrc/__init__.py; fi
          python -m PyInstaller --noconfirm --clean --onefile --name MainSupport --paths . --hidden-import tkinter --hidden-import tkinter.filedialog app.py
          test -f "dist/MainSupport"
          chmod +x "dist/MainSupport"
          codesign --force --sign - "dist/MainSupport"
          codesign --verify --strict "dist/MainSupport"

      - name: Upload x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: main-support-macos-x86_64
          path: main-support/dist/MainSupport
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Move builds to repository root and push
    needs:
      - build-windows
      - build-macos-arm-primary
      - build-macos-arm-fallback
      - build-macos-x64
    if: >-
      ${{
        always() &&
        needs.build-windows.result == 'success' &&
        (needs.build-macos-arm-primary.result == 'success' || needs.build-macos-arm-fallback.result == 'success') &&
        needs.build-macos-x64.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: main-support-windows
          path: release/windows

      - name: Download macOS ARM64 executable
        uses: actions/download-artifact@v4
        with:
          name: main-support-macos-arm64
          path: release/macos-arm64

      - name: Download macOS x64 executable
        uses: actions/download-artifact@v4
        with:
          name: main-support-macos-x86_64
          path: release/macos-x86_64

      - name: Move builds and generate launchers
        shell: bash
        run: |
          set -euo pipefail
          test -f release/windows/MainSupport.exe
          test -f release/macos-arm64/MainSupport
          test -f release/macos-x86_64/MainSupport

          # 存在する場合のみ古い.app形式の成果物を削除
          [ -d "MainSupport-macos-arm64.app" ] && rm -rf MainSupport-macos-arm64.app || true
          [ -d "MainSupport-macos-x86_64.app" ] && rm -rf MainSupport-macos-x86_64.app || true

          # 実行ファイルをリポジトリ直下へ配置
          mv release/windows/MainSupport.exe ./MainSupport.exe
          mv release/macos-arm64/MainSupport ./MainSupport-macos-arm64
          mv release/macos-x86_64/MainSupport ./MainSupport-macos-x86_64
          chmod +x MainSupport-macos-arm64 MainSupport-macos-x86_64

          # macOS起動スクリプト
          cat > MainSupport.sh <<'LAUNCHER'
          #!/bin/bash
          set -e
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          export SUPPORT_ROOT="$ROOT"
          if [ "$(uname -s)" != "Darwin" ]; then
            echo "This launcher is for macOS."
            exit 1
          fi
          MACHINE="$(uname -m)"
          if [ "$MACHINE" = "arm64" ]; then
            EXECUTABLE="$ROOT/MainSupport-macos-arm64"
          elif [ "$MACHINE" = "x86_64" ]; then
            EXECUTABLE="$ROOT/MainSupport-macos-x86_64"
          else
            echo "Unsupported architecture: $MACHINE"
            exit 1
          fi
          if [ ! -f "$EXECUTABLE" ]; then
            echo "MainSupport executable for $MACHINE was not found."
            read -r -p "Press Enter to close..."
            exit 1
          fi
          xattr -cr "$EXECUTABLE" 2>/dev/null || true
          chmod +x "$EXECUTABLE" 2>/dev/null || true
          codesign --force --sign - "$EXECUTABLE" 2>/dev/null || true
          "$EXECUTABLE"
          LAUNCHER
          cp MainSupport.sh MainSupport.command
          chmod +x MainSupport.sh MainSupport.command

          # Windows起動スクリプト
          cat > MainSupport.bat <<'LAUNCHER'
          @echo off
          setlocal
          set "SUPPORT_ROOT=%~dp0"
          cd /d "%SUPPORT_ROOT%"
          if not exist "%SUPPORT_ROOT%MainSupport.exe" (
            echo MainSupport.exe was not found.
            pause
            exit /b 1
          )
          "%SUPPORT_ROOT%MainSupport.exe"
          pause
          LAUNCHER

      - name: Commit and push to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            MainSupport.exe \
            MainSupport-macos-arm64 \
            MainSupport-macos-x86_64 \
            MainSupport.command \
            MainSupport.sh \
            MainSupport.bat
          git update-index --chmod=+x -- MainSupport.command MainSupport.sh
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build Main Support executable for Windows and macOS"
          git push origin HEAD:main
